<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jass with Vreni</title>
<meta name="description" content="Learn Schieber, the Swiss card game Jass, one small step at a time. With Vreni, real Swiss German and plenty of practice.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Crect width=%2720%27 height=%2720%27 rx=%274%27 fill=%27%231f5a3d%27/%3E%3Ccircle cx=%2710%27 cy=%2710%27 r=%276%27 fill=%27%23f4c81e%27 stroke=%27%23201d18%27/%3E%3Cpath d=%27M5 12.5L15 7.5%27 stroke=%27%23cf3a2b%27 stroke-width=%272.4%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&family=Patrick+Hand&display=swap">
<style>
:root{
  /* Layout idea: one phone-width column on a green Jassteppich. Slate panels carry
     Vreni's chalk voice, and the cards are the only paper-white objects on the table. */
  --felt:#1f5a3d;
  --felt-deep:#143d29;
  --felt-line:#2f7350;
  --slate:#24292c;
  --slate-edge:#8a6a43;
  --chalk:#f4efe2;
  --chalk-dim:#bdb8aa;
  --paper:#fbf6e8;
  --ink:#201d18;
  --red:#d1341f;
  --gold:#e6b43c;
  --good:#8fd694;
  --bad:#ff9d8a;
  --font-display:'Lilita One','Trebuchet MS',sans-serif;
  --font-chalk:'Patrick Hand','Comic Sans MS',cursive;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--felt-deep);
  background-image:radial-gradient(circle at 50% 0,var(--felt) 0,var(--felt-deep) 70%);
  background-attachment:fixed;
  color:var(--chalk);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.45;
  min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:16px}
#app{display:flex;flex-direction:column;gap:14px}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:26px;letter-spacing:.5px;margin-right:auto;background:none;border:0;padding:4px 0;color:var(--chalk)}
.brand b{color:var(--gold);font-weight:400}
.chip{border:1.5px solid var(--felt-line);background:rgba(0,0,0,.18);border-radius:999px;padding:6px 14px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* slate panels */
.slate{background:var(--slate);border:5px solid var(--slate-edge);border-radius:6px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.slate h1,.slate h2{font-family:var(--font-display);font-weight:400;margin:0 0 6px;text-wrap:balance;letter-spacing:.4px}
.slate h1{font-size:30px}
.slate h2{font-size:23px}
.slate p{margin:0 0 8px;max-width:62ch}
.slate p:last-child{margin-bottom:0}
.chalk{font-family:var(--font-chalk);font-size:22px;line-height:1.25}
.dim{color:var(--chalk-dim)}
.small{font-size:14.5px}

/* Vreni */
.vreni-row{display:flex;gap:14px;align-items:flex-start}
.vreni{flex:0 0 auto;width:84px;height:84px}
.vreni.sm{width:60px;height:60px}
.bubble{flex:1;min-width:0}
.bubble .tr{display:block;font-family:var(--font-body);font-size:14.5px;color:var(--chalk-dim)}

/* learning path */
.path{display:flex;flex-direction:column;gap:12px}
.stage{background:rgba(0,0,0,.2);border:1.5px solid var(--felt-line);border-radius:10px;padding:14px}
.stage.locked{opacity:.55}
.stage-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage-num{font-family:var(--font-display);font-size:20px;color:var(--gold)}
.stage h3{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.3px}
.stage .state{margin-left:auto;font-size:14px;color:var(--chalk-dim)}
.stage p{margin:4px 0 10px;font-size:15.5px;color:var(--chalk-dim)}
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson-btn{display:flex;align-items:center;gap:10px;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:8px;padding:10px 12px;font-weight:700}
.lesson-btn .lvl{font-weight:400;font-size:13.5px;color:#5c574c;margin-left:auto;white-space:nowrap}
.lesson-btn .tick{width:22px;height:22px;border-radius:50%;border:2px solid #b9b2a0;flex:0 0 auto;display:grid;place-items:center;font-size:13px}
.lesson-btn.done .tick{background:var(--felt);border-color:var(--felt);color:#fff}
.lesson-btn.next{box-shadow:0 0 0 3px var(--gold)}
.lesson-btn:disabled{cursor:not-allowed;background:#cfcabb}
.later{font-size:15px;color:var(--chalk-dim);border-top:1px dashed var(--felt-line);padding-top:12px}
.later b{color:var(--chalk);font-weight:700}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:10px}
.lesson-top .t{font-size:14.5px;color:var(--chalk-dim);margin-right:auto}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--chalk-dim)}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.prompt{font-family:var(--font-display);font-size:25px;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.3px}
.table{background:var(--felt);border:2px solid var(--felt-line);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
.row-label{font-size:13.5px;text-transform:uppercase;letter-spacing:1.2px;color:#cfe3d5;align-self:flex-start}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cardbox{display:flex;flex-direction:column;align-items:center;gap:3px}
.card{width:74px;padding:0;border:0;background:none;border-radius:8px;display:block;transition:transform .12s}
.card svg{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.hand .card{width:60px}
button.card:hover:not(:disabled){transform:translateY(-4px)}
.card.sel svg{box-shadow:0 0 0 4px var(--gold),0 2px 5px rgba(0,0,0,.4)}
.card.right svg{box-shadow:0 0 0 4px var(--good),0 2px 5px rgba(0,0,0,.4)}
.card.wrong svg{box-shadow:0 0 0 4px var(--bad),0 2px 5px rgba(0,0,0,.4)}
.card.offsuit{opacity:.5}
.card.same svg{box-shadow:0 6px 0 var(--gold),0 2px 5px rgba(0,0,0,.4)}
.card.same{margin-bottom:5px}
.card.big{width:104px}
.cap{font-size:13px;color:#e6f0e9;text-align:center;min-height:17px}
.tag{font-size:12px;background:var(--gold);color:var(--ink);border-radius:4px;padding:0 6px;font-weight:700}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opt{background:var(--paper);color:var(--ink);border:0;border-radius:8px;padding:11px 10px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.opt small{display:block;font-weight:400;font-size:13px;color:#5c574c}
.opt.right{background:var(--good)}
.opt.wrong{background:var(--bad)}
.opt:disabled{cursor:default}
.primary{background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 22px;font-weight:700;font-size:17px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1.5px solid var(--chalk-dim);border-radius:8px;padding:10px 16px}

.breaks{display:flex;flex-direction:column;gap:10px}
.break{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.break h3{font-family:var(--font-display);font-weight:400;font-size:19px;margin:6px 0 0;letter-spacing:.3px}
.break a:not(.link){color:var(--gold)}
.player{width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
a.link{display:inline-block;color:var(--gold);border-color:var(--gold);text-decoration:none;font-weight:700;margin-right:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* aids */
.aid{border:1.5px dashed var(--chalk-dim);border-radius:8px;padding:10px 12px;font-size:15.5px;display:flex;flex-direction:column;gap:6px}
.aid .chalk{font-size:19px}
.ladder{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-weight:700}
.ladder span.sep{color:var(--chalk-dim);font-weight:400}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:4px 12px;font-variant-numeric:tabular-nums}
.vals div{display:flex;justify-content:space-between;border-bottom:1px solid #3a4145;padding:2px 0}
.help{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;color:var(--chalk-dim);margin:0}
.seg{display:inline-flex;border:1.5px solid var(--felt-line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:700}

/* feedback */
.fb{border-left:6px solid var(--good)}
.fb.no{border-left-color:var(--bad)}
.fb .verdict{font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--good)}
.fb.no .verdict{color:var(--bad)}

/* deck sheet */
.suits{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.suit{background:rgba(255,255,255,.06);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center}
.suit svg{width:38px;height:38px;flex:0 0 auto;background:var(--paper);border-radius:6px;padding:4px}
.suit b{display:block;font-size:17px}
.suit span{display:block;font-size:13.5px;color:var(--chalk-dim)}
.say{font-style:italic}
.deckrow{display:flex;flex-wrap:wrap;gap:6px}
.deckrow .cardbox .card{width:54px}
.sheet-table{width:100%;border-collapse:collapse;font-size:15.5px;font-variant-numeric:tabular-nums}
.sheet-table th,.sheet-table td{text-align:left;padding:5px 6px;border-bottom:1px solid #3a4145}
.sheet-table th{font-weight:700;color:var(--chalk-dim);font-size:13.5px;text-transform:uppercase;letter-spacing:.8px}
.sheet-table td.n{text-align:right}
.sheet-table td.say,.sheet-table td:first-child{white-space:nowrap}
.scroll{overflow-x:auto}
.spk{background:none;border:1.5px solid var(--gold);color:var(--gold);border-radius:999px;width:28px;height:28px;padding:0;font-size:13px;line-height:1}
details summary{cursor:pointer;color:var(--chalk-dim);font-size:15px}
.clips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.clips .chip{font-size:13.5px;padding:4px 10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--chalk);padding:10px 16px;border-radius:8px;font-size:15px;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.score{font-family:var(--font-display);font-size:54px;line-height:1;color:var(--gold)}
@media (max-width:400px){
  .card{width:66px}.hand .card{width:54px}.prompt{font-size:22px}
  .vreni{width:66px;height:66px}
  .brand{font-size:22px}.chip{padding:5px 10px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <button class="brand" id="home-btn" type="button">Jass <b>with</b> Vreni</button>
    <button class="chip" id="deck-btn" type="button">The cards</button>
    <button class="chip" id="sound-btn" type="button" aria-pressed="true">Sound on</button>
  </header>
  <main id="app"></main>
</div>
<script>
/*LOGIC-START*/
const SUITS=[
  {id:'eichle',name:'Eichle',en:'acorns',say:'EYE-khleh'},
  {id:'rose',name:'Rose',en:'roses',say:'ROH-zeh'},
  {id:'schelle',name:'Schelle',en:'bells',say:'SHELL-eh'},
  {id:'schilte',name:'Schilte',en:'shields',say:'SHILL-teh'}
];
// Strongest first. This is the order of a plain suit (no Trumpf).
const RANKS=[
  {id:'A',name:'Ass',en:'ace',say:'ahss',pts:11},
  {id:'K',name:'König',en:'king',say:'KUH-nig',pts:4},
  {id:'O',name:'Ober',en:'the queen\u2019s stand-in',say:'OH-ber',pts:3},
  {id:'U',name:'Under',en:'like a jack',say:'OON-der',pts:2},
  {id:'B',name:'Banner',en:'the ten',say:'BAHN-ner',pts:10},
  {id:'9',name:'9',en:'nine',say:'',ch:'Nüüni',chSay:'NEW-nee',pts:0},
  {id:'8',name:'8',en:'eight',say:'',ch:'Achti',chSay:'AHKH-tee',pts:0},
  {id:'7',name:'7',en:'seven',say:'',ch:'Sibni',chSay:'SEEB-nee',pts:0},
  {id:'6',name:'6',en:'six',say:'',ch:'Sächsi',chSay:'SAKH-see',pts:0}
];
const suitOf=id=>SUITS.find(s=>s.id===id);
const rankOf=id=>RANKS.find(r=>r.id===id);
const rankIdx=id=>RANKS.findIndex(r=>r.id===id);
const points=c=>rankOf(c.r).pts;
const cardName=c=>rankOf(c.r).name+' of '+suitOf(c.s).name;
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function deck(){const d=[];for(const s of SUITS)for(const r of RANKS)d.push({s:s.id,r:r.id});return d}

// Index of the card that wins a trick without Trumpf: highest card of the suit led.
function trickWinner(cards){
  let w=0;
  for(let i=1;i<cards.length;i++){
    if(cards[i].s===cards[0].s&&rankIdx(cards[i].r)<rankIdx(cards[w].r))w=i;
  }
  return w;
}
// Indices of the cards you may play without Trumpf: follow suit if you can.
function legalCards(hand,led){
  const same=hand.map((c,i)=>c.s===led.s?i:-1).filter(i=>i>=0);
  return same.length?same:hand.map((_,i)=>i);
}
const trickPoints=cards=>cards.reduce((n,c)=>n+points(c),0);

const LADDER=RANKS.map(r=>r.name);
const PICK_HINT={
  A:'The Ass has no name and no number. Just two big suit signs.',
  K:'Read the corner: KÖNIG. He is also the one wearing the crown.',
  O:'Read the corner: OBER. He holds his suit sign up high, next to his head.',
  U:'Read the corner: UNDER. He holds his suit sign down low, near the middle of the card.',
  B:'The Banner is the flag with a 10 in the corners.'
};
const COUSIN={U:'Jack',O:'Queen',K:'King',B:'Ten'};

function qSuit(){
  const s=pick(SUITS),r=pick(['6','7','8','9','A']);
  return {type:'suit',prompt:'Which suit is this?',cards:[{s:s.id,r}],
    options:SUITS.map(x=>({id:x.id,label:x.name,sub:x.en})),answer:s.id,
    explain:'That is '+s.name+', the '+s.en+'.'};
}
function qPick(){
  const s=pick(SUITS).id,target=pick(['K','O','U','B','A']);
  const others=shuffle(['K','O','U','B','A'].filter(r=>r!==target)).slice(0,3);
  const cards=shuffle(others.concat(target)).map(r=>({s,r}));
  return {type:'pick',prompt:'Tap the '+rankOf(target).name+'.',cards,
    answer:cards.findIndex(c=>c.r===target),explain:PICK_HINT[target],target};
}
function qBridge(){
  const s=pick(SUITS).id,target=pick(['U','O','K','B']);
  let explain='The '+rankOf(target).name+' is your '+COUSIN[target]+'.';
  if(target==='O')explain='The Ober sits where your Queen would. He is a man, though. A Jass deck has no queens.';
  if(target==='B')explain='The Banner is the ten. Look for the flag and the 10 in the corners.';
  return {type:'bridge',prompt:'Which card from an American deck is this one’s cousin?',cards:[{s,r:target}],
    options:['Jack','Queen','King','Ten'].map(x=>({id:x,label:x})),answer:COUSIN[target],explain,target};
}
function qNumber(covered){
  const s=pick(SUITS).id,r=Math.random()<.8?pick(['6','9']):pick(['7','8']);
  const looks={'6':'a 9','9':'a 6','8':'an 8','7':'an L'}[r];
  let explain;
  if(covered)explain=(r==='6'||r==='9')
    ?'This is the '+r+'. The number at the bottom is printed upside down, so it looks like '+looks+'.'
    :'This is the '+r+'. Upside down it looks like '+looks+', which is hard to mix up.';
  else explain='The top corners say '+r+'. That is the number to read.'+((r==='6'||r==='9')?' The one at the bottom is upside down and looks like '+looks+'.':'');
  return {type:'number',prompt:covered?'The top of this card is hidden. Which card is it?':'Which card is this?',
    cards:[{s,r,cover:!!covered}],options:['6','7','8','9'].map(x=>({id:x,label:x})),answer:r,explain,covered:!!covered};
}
function qStronger(){
  const s=pick(SUITS).id;
  let a=rnd(9),b=rnd(9);while(b===a)b=rnd(9);
  if(Math.random()<.45){a=4;b=pick([1,2,3,5])}            // put the Banner in play often
  const cards=shuffle([{s,r:RANKS[a].id},{s,r:RANKS[b].id}]);
  const win=trickWinner(cards),lose=1-win;
  let explain='The '+rankOf(cards[win].r).name+' beats the '+rankOf(cards[lose].r).name+'.';
  if(cards[lose].r==='B'&&['K','O','U'].includes(cards[win].r))explain+=' The Banner is a ten, but it ranks below the Under.';
  return {type:'stronger',prompt:'Which card is stronger?',cards,answer:win,explain};
}
function qWinner(offsuit){
  const led=pick(SUITS).id;let cards;
  if(!offsuit){
    cards=shuffle(RANKS).slice(0,4).map(r=>({s:led,r:r.id}));
  }else{
    const nSame=pick([2,3]);
    const lowish=shuffle(RANKS.slice(2));                     // suit led: no Ass or König, so the trap works
    const same=lowish.slice(0,nSame).map(r=>({s:led,r:r.id}));
    const otherSuits=shuffle(SUITS.filter(x=>x.id!==led));
    const off=[{s:otherSuits[0].id,r:pick(['A','K'])}];
    if(nSame===2)off.push({s:otherSuits[1].id,r:pick(RANKS).id});
    cards=[same[0]].concat(shuffle(same.slice(1).concat(off)));
  }
  const w=trickWinner(cards),sn=suitOf(led).name;
  let explain=sn+' was led, and the '+rankOf(cards[w].r).name+' is the highest '+sn+' on the table.';
  const trap=cards.find((c,i)=>c.s!==led&&rankIdx(c.r)<rankIdx(cards[w].r));
  if(trap)explain+=' The '+cardName(trap)+' looks grand, but it is the wrong suit. It wins nothing.';
  return {type:'winner',prompt:'Who wins this trick?',cards,answer:w,explain,led};
}
function qLegal(size){
  const d=shuffle(deck());const led=d.pop();
  const has=Math.random()<.65;
  const same=d.filter(c=>c.s===led.s),rest=d.filter(c=>c.s!==led.s);
  const k=has?Math.min(1+rnd(3),size-1):0;
  const hand=shuffle(same.slice(0,k).concat(rest.slice(0,size-k)));
  hand.sort((x,y)=>SUITS.findIndex(s=>s.id===x.s)-SUITS.findIndex(s=>s.id===y.s)||rankIdx(x.r)-rankIdx(y.r));
  const answer=legalCards(hand,led),sn=suitOf(led.s).name;
  const explain=has
    ?'You hold '+sn+', so you must follow suit. Only your '+sn+' cards are allowed.'
    :'You hold no '+sn+', so you may play any card you like.';
  return {type:'legal',prompt:'Which cards may you play?',cards:[led],hand,answer,explain,led:led.s,has};
}
function qValue(){
  const s=pick(SUITS).id;
  const r=Math.random()<.75?pick(['A','K','O','U','B']):pick(['9','8','7','6']);
  const c={s,r},p=points(c);
  let explain='The '+rankOf(r).name+' is worth '+p+(p===1?' point.':' points.');
  if(p===0)explain='The '+r+' is worth nothing. It still wins tricks, though.';
  if(r==='B')explain='The Banner is worth 10. Weak in a fight, rich in points.';
  return {type:'value',prompt:'How many points is this card worth?',cards:[c],
    options:[0,2,3,4,10,11].map(n=>({id:n,label:String(n)})),answer:p,explain};
}
function qCount(){
  let cards,total;
  do{cards=shuffle(deck()).slice(0,4);total=trickPoints(cards)}while(total===0);
  const cand=shuffle([total+2,total-2,total+10,total-10,total+3,total-3,total+4,total+11]
    .filter(n=>n>=0&&n!==total));
  const opts=[total];for(const n of cand){if(opts.length<4&&!opts.includes(n))opts.push(n)}
  opts.sort((a,b)=>a-b);
  const parts=cards.map(c=>rankOf(c.r).name+' '+points(c));
  return {type:'count',prompt:'How many points are in this trick?',cards,
    options:opts.map(n=>({id:n,label:String(n)})),answer:total,
    explain:parts.join(' + ')+' = '+total+'.'};
}

const STAGES=[

/* ---------- sound ---------- */
let AC=null;
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}return AC}
function tone(freq,dur,type,vol,when){
  const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);
  o.type=type||'sine';o.frequency.value=freq;g.gain.setValueAtTime(vol||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur);
}
function sfx(kind,delay){
  if(!S.sound)return;
  try{
    const a=ac();if(!a)return;if(a.state==='suspended')a.resume();
    if(kind==='slap'){
      const len=Math.floor(a.sampleRate*.08),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
      const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
      src.buffer=buf;f.type='lowpass';f.frequency.value=1400;g.gain.value=.5;
      src.connect(f);f.connect(g);g.connect(a.destination);src.start();
    }
    if(kind==='good'){tone(660,.12,'sine',.12);tone(880,.18,'sine',.12,.1)}
    if(kind==='bad'){tone(220,.22,'triangle',.12)}
    if(kind==='bell'){const d=delay||0;for(let k=0;k<3;k++){tone(540,.35,'square',.07,d+k*.28);tone(800,.35,'square',.07,d+k*.28)}}
  }catch(e){}
}

function say(key){
  if(!RECORDED.has(key))return false;
  try{
    if(playing){playing.pause()}
    const a=CLIPS[key]||(CLIPS[key]=new Audio('audio/'+key+'.mp3'));
    if(a.readyState>0)a.currentTime=0;playing=a;
    const p=a.play();if(p&&p.catch)p.catch(()=>{});
    return true;
  }catch(e){return false}
}

    +'</div></div></div>'
    +'<div class="path"><h2 class="prompt">Chapter 1 · First tricks</h2>'+stages
    +'<p class="later"><b>Still to come:</b> Chapter 2 · Trumpf, Chapter 3 · Playing well, Chapter 4 · The full game.</p></div>'
    +'<div class="slate breaks"><h2>For the breaks</h2><p class="dim small">Two Swiss classics on YouTube. Both are in Swiss German, which is half the fun.</p>'
    +'<div class="break">'+(PUBLIC_SITE?'<h3>Vreni’s favourite Jass song</h3>'+player('V450wfaf0jE','E schöni Jass-Rundi by Oesch’s die Dritten'):songLink('Vreni’s favourite Jass song'))+'<span class="small dim">«E schöni Jass-Rundi» by Oesch’s die Dritten. She sings along. You have been warned.'+(PUBLIC_SITE?' <a href="'+SONG_URL+'">Open on YouTube</a>':'')+'</span></div>'
    +'<div class="break">'+(PUBLIC_SITE?'<h3>Emil plays Jass</h3>'+player('7F2mBZ3Axs8','Der Jasser, a sketch by Emil, 1974'):extLink(SKETCH_URL,'Emil plays Jass'))+'<span class="small dim">«Der Jasser», a sketch by the comedian Emil from 1974. Vreni says she has met this man at every table.'+(PUBLIC_SITE?' <a href="'+SKETCH_URL+'">Open on YouTube</a>':'')+'</span></div></div>';
}

/* ---------- the cards sheet ---------- */
function renderDeck(){
  L=null;
  app.innerHTML='<div class="slate" style="display:flex;flex-direction:column;gap:14px">'
    +'<div><h1>The cards</h1><p class="dim">Your cheat sheet for Chapter 1. Come back whenever you like.</p></div>'
    +'<div><h2>Four suits</h2>'+suitsHTML()+'</div>'
    +'<div><h2>Nine cards in each suit</h2><div class="scroll"><table class="sheet-table"><thead><tr><th>Card</th><th>Say it</th><th>Like</th><th>Points</th></tr></thead><tbody>'
    +RANKS.map(r=>'<tr><td><b>'+r.name+'</b>'+spk(r.id)+'</td><td class="say">'+(r.say||(r.ch+' · '+r.chSay))+'</td><td>'+r.en+'</td><td class="n">'+r.pts+'</td></tr>').join('')
    +'</tbody></table></div><p class="small dim">Listed from strongest to weakest. The Banner is worth a lot but wins little.</p></div>'
    +'<div><h2>What they look like</h2>'+SUITS.map(s=>facesHTML(s.id)).join('<div style="height:8px"></div>')
    +'<p class="small dim" style="margin-top:10px">These are simplified drawings. On a real card the number stands upright at the top and upside down at the bottom, so a 6 looks like a 9 from below. Always read the top corners. The picture cards carry their names, the Banner shows a 10, and the Ass shows nothing but two suit signs.</p>'
    +'<p style="margin-top:10px"><a class="ghost link" href="https://jasswiki.ch/grundlagen-kultur/jasskarten/">See the real cards</a> <span class="small dim">Photos of all 36 cards on Jass-Wiki. The page is in German.</span></p></div>'
    +'<div><h2>Words you will hear</h2><div class="scroll"><table class="sheet-table"><tbody>'
    +WORDS.map(w=>'<tr><td><b>'+w[1]+'</b>'+spk(w[0])+'</td><td class="say">'+w[2]+'</td><td>'+w[3]+'</td></tr>').join('')
    +'</tbody></table></div></div>'
    +'<div><h2>Two rules so far</h2><p>1. If you hold the suit that was led, you must play it.</p><p>2. The highest card of the suit led wins the trick. Other suits never win.</p>'
    +'<p class="small dim">We play counter-clockwise. Trumpf arrives in Chapter 2 and bends both rules.</p></div>'
    +(PUBLIC_SITE?'':'<details><summary>Recording check (temporary, for Christa)</summary><p class="small dim">Every clip in the app, including the ones for later chapters.</p><div class="clips">'
    +Array.from(RECORDED).map(k=>'<button class="chip" type="button" data-say="'+k+'">'+k+'</button>').join('')+'</div></details>')
    +'<div class="actions"><button class="primary" type="button" data-go="home">Back to the path</button></div></div>';
}

/* ---------- lesson ---------- */
function startLesson(si,li){
  const ls=STAGES[si].lessons[li];
  const queue=[];for(let i=0;i<ls.n;i++){const q=ls.gen(i);q.first=true;queue.push(q)}
  L={si,li,ls,queue,idx:0,marks:[],right:0,help:ls.help,phase:'intro',hinted:false,sel:[],chosen:null,ok:null};
  renderLesson();
}
function renderLesson(){
  const st=STAGES[L.si];
  if(L.phase==='intro'){
    app.innerHTML='<div class="slate"><div class="vreni-row">'+vreni('happy')+'<div class="bubble">'
      +'<h2>'+L.ls.title+'</h2><p>'+L.ls.text+'</p></div></div>'
      +(L.ls.intro?'<div style="margin-top:14px">'+introVisual(L.ls.intro)+'</div>':'')
      +'<div class="actions" style="margin-top:16px"><button class="primary" type="button" data-act="begin">Start</button>'
      +'<button class="ghost" type="button" data-go="home">Not now</button></div></div>';
    return;
  }
  const q=L.queue[L.idx],answered=L.phase==='feedback';
  const showAid=L.help===0||(L.help===1&&L.hinted);
  const labels=showAid&&['stronger','winner','legal','count'].includes(q.type);
  const dots=L.queue.slice(0,L.ls.n).map((_,i)=>'<span class="dot'+(L.marks[i]===true?' ok':L.marks[i]===false?' no':'')+(i===Math.min(L.idx,L.ls.n-1)&&L.idx<L.ls.n?' now':'')+'"></span>').join('');
  const cardBtn=(c,i,group)=>{
    const tappable=(group==='table'&&['pick','stronger','winner'].includes(q.type))||(group==='hand');
    let cls='card';
    if(group==='table'&&['suit','bridge','value','number'].includes(q.type))cls+=' big';
    if(group==='hand'&&L.sel.includes(i))cls+=' sel';
    if(showAid&&q.type==='winner'&&c.s!==q.led&&!answered)cls+=' offsuit';
    if(showAid&&q.type==='legal'&&group==='hand'&&c.s===q.led)cls+=' same';
    if(answered){
      if(group==='hand'){if(q.answer.includes(i))cls+=' right';else if(L.sel.includes(i))cls+=' wrong'}
      else if(tappable){if(i===q.answer)cls+=' right';else if(i===L.chosen)cls+=' wrong'}
    }
    const tag=(group==='table'&&q.type==='winner'&&i===0)||(group==='table'&&q.type==='legal')?'<span class="tag">led</span>':'';
    const cap=labels?rankOf(c.r).name:'';
    const inner=tappable
      ?'<button type="button" class="'+cls+'" data-card="'+i+'" data-group="'+group+'"'+(answered?' disabled':'')+' aria-pressed="'+(group==='hand'&&L.sel.includes(i))+'">'+cardSVG(c)+'</button>'
      :'<span class="'+cls+'">'+cardSVG(c)+'</span>';
    return '<div class="cardbox">'+inner+'<span class="cap">'+cap+' '+tag+'</span></div>';
  };
  let table='<div class="cards">'+q.cards.map((c,i)=>cardBtn(c,i,'table')).join('')+'</div>';
  if(q.type==='legal')table='<span class="row-label">On the table</span>'+table+'<span class="row-label">Your hand</span><div class="cards hand">'+q.hand.map((c,i)=>cardBtn(c,i,'hand')).join('')+'</div>';
  let options='';
  if(q.options)options='<div class="options">'+q.options.map(o=>{
    let cls='opt';if(answered){if(o.id===q.answer)cls+=' right';else if(o.id===L.chosen)cls+=' wrong'}
    return '<button type="button" class="'+cls+'" data-opt="'+o.id+'"'+(answered?' disabled':'')+'>'+o.label+(o.sub?'<small>'+o.sub+'</small>':'')+'</button>'}).join('')+'</div>';
  if(q.type==='legal'&&!answered)options='<div class="actions"><button class="primary" type="button" data-act="check"'+(L.sel.length?'':' disabled')+'>Check</button><span class="small dim">Tap every card that is allowed.</span></div>';
  let aid='';
  if(showAid&&!answered)aid='<div class="aid">'+aidHTML(q)+'</div>';
  else if(L.help===1&&!answered)aid='<div class="actions"><button class="ghost" type="button" data-act="hint">Ask Vreni for a hint</button></div>';
  let fb='';
  if(answered){
    const line=L.line;
    fb='<div class="slate fb'+(L.ok?'':' no')+'"><div class="vreni-row">'+vreni(L.ok?'happy':'oops','sm')+'<div class="bubble">'
      +'<span class="verdict">'+(L.ok?'Correct':'Not quite')+'</span>'
      +'<p class="chalk">'+line[0]+'<span class="tr">'+line[1]+'</span></p><p>'+q.explain+'</p>'
      +(!L.ok&&q.first?'<p class="small dim">This one comes back at the end.</p>':'')
      +'<div class="actions" style="margin-top:10px"><button class="primary" type="button" data-act="next" id="next-btn">'+(L.idx+1<L.queue.length?'Next':'Finish')+'</button></div>'
      +'</div></div></div>';
  }
  const helpSeg=L.ls.check
    ?'<p class="help">A check is done on your own. Want help? Go back to the lessons of this stage.</p>'
    :'<div class="help"><span>Help:</span><div class="seg" role="group" aria-label="Help level">'
    +HELP.map((h,i)=>'<button type="button" data-help="'+i+'" aria-pressed="'+(L.help===i)+'">'+h+'</button>').join('')+'</div></div>';
  app.innerHTML='<div class="lesson-top"><span class="t">Stage '+(L.si+1)+' · '+L.ls.title+(q.first?'':' · second try')+'</span><div class="dots">'+dots+'</div>'
    +'<button class="ghost" type="button" data-go="home" aria-label="Leave lesson">Leave</button></div>'
    +'<h2 class="prompt">'+q.prompt+'</h2><div class="table">'+table+'</div>'+options+aid+fb+helpSeg;
  if(answered){const b=document.getElementById('next-btn');if(b)b.focus({preventScroll:false})}
}
function aidHTML(q){
  if(q.type==='suit')return suitsHTML();
  if(q.type==='pick')return '<span class="chalk">'+PICK_HINT[q.target]+'</span>';
  if(q.type==='bridge')return '<span>Under = Jack. Ober = Queen’s seat. König = King. Banner = Ten.</span>';
  if(q.type==='number')return '<span>'+(q.covered?'The number down there is upside down. Turn it in your head: what looks like a 9 is a 6, and the other way round.':'Read the top corners. The number at the bottom is upside down.')+'</span>';
  if(q.type==='stronger')return ladderHTML();
  if(q.type==='winner')return '<span><b>'+suitOf(q.led).name+'</b> was led. Only '+suitOf(q.led).name+' can win.</span>'+ladderHTML();
  if(q.type==='legal')return '<span><b>'+suitOf(q.led).name+'</b> was led. Hold that suit? Then play it. Hold none? Then anything goes.</span>'+(q.has?'<span class="small dim">The gold bar marks your '+suitOf(q.led).name+' cards.</span>':'');
  return valuesHTML();
}
function answer(ok){
  const q=L.queue[L.idx];L.ok=ok;L.phase='feedback';
  if(q.first){L.marks[L.idx]=ok;if(ok)L.right++;else{const again=L.ls.gen(L.idx);again.first=false;L.queue.push(again)}}
  L.line=ok&&q.type==='winner'&&Math.random()<.4?TRICK_LINE:pick(ok?GOOD:BAD);
  if(ok&&q.type==='number'){const r=rankOf(q.answer);L.line=[r.ch+'!',r.en.charAt(0).toUpperCase()+r.en.slice(1)+'.',AUDIO_KEY[r.id]]}
  if(!voice(L.line[2]))sfx(ok?'good':'bad');
  renderLesson();
}
function finishLesson(){
  const score=L.right/L.ls.n,k=lkey(L.si,L.li),prev=S.best[k]||0;
  const wasPassed=stagePassed(L.si);
  S.best[k]=Math.max(prev,score);save();
  const passed=!L.ls.check||score>=PASS;
  if(L.ls.check&&passed){const spoke=voice('jetzt-chasch-es');if(!wasPassed)sfx('bell',spoke?1.5:0)}
  else if(!L.ls.check&&score>=PASS)voice('suuber');
  const pct=Math.round(score*100);
  let msg;
  if(L.ls.check)msg=passed
    ?'<p class="chalk">Jetzt chasch es!<span class="tr">Now you’ve got it!</span></p><p>Stage '+(L.si+1)+' is done.'+(L.si+1<STAGES.length?' Stage '+(L.si+2)+' is open.':' That was all of Chapter 1.')+'</p>'
     +'<p class="small">'+songLink('Celebrate with a song')+' <span class="dim">When Vreni wins, she puts this on.</span></p>'
    :'<p class="chalk">Fast.<span class="tr">Almost.</span></p><p>You need 80% to open the next stage. Go back a lesson, or try the check again. No one is counting but me.</p>'
     +'<p class="small">'+extLink(SKETCH_URL,'Take a break with Emil')+' <span class="dim">«Der Jasser», a Swiss comedy classic from 1974.</span></p>';
  else msg='<p class="chalk">'+(score>=PASS?'Suuber!':'Guet.')+'<span class="tr">'+(score>=PASS?'Clean!':'Good.')+'</span></p><p>'+(score>=PASS?'Ready for the next lesson, with a little less help.':'Do it once more if you like. Repeating is how Jass gets into your hands.')+'</p>';
  const si=L.si,li=L.li;
  app.innerHTML='<div class="slate"><div class="vreni-row">'+vreni(passed?'happy':'oops')+'<div class="bubble"><div class="score">'+pct+'%</div>'
    +'<p class="dim small">'+L.right+' of '+L.ls.n+' right on the first try</p>'+msg+'</div></div>'
    +'<div class="actions" style="margin-top:16px"><button class="primary" type="button" data-go="home">Back to the path</button>'
    +'<button class="ghost" type="button" data-stage="'+si+'" data-lesson="'+li+'">Again</button></div></div>';
  L=null;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='home-btn'||t.dataset.go==='home'){renderHome();window.scrollTo(0,0);return}
  if(t.id==='deck-btn'){renderDeck();window.scrollTo(0,0);return}
  if(t.id==='sound-btn'){S.sound=!S.sound;save();syncSound();if(S.sound)sfx('good');return}
  if(t.dataset.say){say(t.dataset.say);return}
  if(t.dataset.stage!==undefined&&t.dataset.lesson!==undefined){startLesson(+t.dataset.stage,+t.dataset.lesson);window.scrollTo(0,0);return}
  if(!L)return;
  const q=L.queue[L.idx];
  if(t.dataset.help!==undefined){if(!L.ls.check){L.help=+t.dataset.help;L.hinted=false;renderLesson()}return}
  if(t.dataset.act==='begin'){L.phase='ask';renderLesson();return}
  if(t.dataset.act==='hint'){L.hinted=true;if(!L.hintSaid){L.hintSaid=true;voice('zerscht-daenke')}renderLesson();return}
  if(t.dataset.act==='next'){
    L.idx++;L.sel=[];L.chosen=null;L.hinted=false;L.ok=null;
    if(L.idx>=L.queue.length){finishLesson()}else{L.phase='ask';renderLesson()}
    window.scrollTo(0,0);return;
  }
  if(L.phase!=='ask')return;
  if(t.dataset.opt!==undefined){
    const v=typeof q.answer==='number'?+t.dataset.opt:t.dataset.opt;
    L.chosen=v;answer(v===q.answer);return;
  }
  if(t.dataset.card!==undefined){
    const i=+t.dataset.card;sfx('slap');
    if(t.dataset.group==='hand'){
      L.sel=L.sel.includes(i)?L.sel.filter(x=>x!==i):L.sel.concat(i);renderLesson();return;
    }
    L.chosen=i;answer(i===q.answer);return;
  }
  if(t.dataset.act==='check'){
    const a=q.answer.slice().sort((x,y)=>x-y),s=L.sel.slice().sort((x,y)=>x-y);
    answer(a.length===s.length&&a.every((x,i)=>x===s[i]));return;
  }
});
function syncSound(){const b=document.getElementById('sound-btn');b.setAttribute('aria-pressed',String(S.sound));b.textContent=S.sound?'Sound on':'Sound off'}
syncSound();renderHome();
</script>
