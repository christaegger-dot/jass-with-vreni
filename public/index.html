<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jass with Vreni</title>
<meta name="description" content="Learn Schieber, the Swiss card game Jass, one small step at a time. With Vreni, real Swiss German and plenty of practice.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 20 20%27%3E%3Crect width=%2720%27 height=%2720%27 rx=%274%27 fill=%27%231f5a3d%27/%3E%3Ccircle cx=%2710%27 cy=%2710%27 r=%276%27 fill=%27%23f4c81e%27 stroke=%27%23201d18%27/%3E%3Cpath d=%27M5 12.5L15 7.5%27 stroke=%27%23cf3a2b%27 stroke-width=%272.4%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&family=Patrick+Hand&display=swap">
<style>
:root{
  /* Layout idea: one phone-width column on a green Jassteppich. Slate panels carry
     Vreni's chalk voice, and the cards are the only paper-white objects on the table. */
  --felt:#1f5a3d;
  --felt-deep:#143d29;
  --felt-line:#2f7350;
  --slate:#24292c;
  --slate-edge:#8a6a43;
  --chalk:#f4efe2;
  --chalk-dim:#bdb8aa;
  --paper:#fbf6e8;
  --ink:#201d18;
  --red:#d1341f;
  --gold:#e6b43c;
  --good:#8fd694;
  --bad:#ff9d8a;
  --font-display:'Lilita One','Trebuchet MS',sans-serif;
  --font-chalk:'Patrick Hand','Comic Sans MS',cursive;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--felt-deep);
  background-image:radial-gradient(circle at 50% 0,var(--felt) 0,var(--felt-deep) 70%);
  background-attachment:fixed;
  color:var(--chalk);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.45;
  min-height:100vh;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:16px}
#app{display:flex;flex-direction:column;gap:14px}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-size:26px;letter-spacing:.5px;margin-right:auto;background:none;border:0;padding:4px 0;color:var(--chalk)}
.brand b{color:var(--gold);font-weight:400}
.chip{border:1.5px solid var(--felt-line);background:rgba(0,0,0,.18);border-radius:999px;padding:6px 14px;font-size:15px}
.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* slate panels */
.slate{background:var(--slate);border:5px solid var(--slate-edge);border-radius:6px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.slate h1,.slate h2{font-family:var(--font-display);font-weight:400;margin:0 0 6px;text-wrap:balance;letter-spacing:.4px}
.slate h1{font-size:30px}
.slate h2{font-size:23px}
.slate p{margin:0 0 8px;max-width:62ch}
.slate p:last-child{margin-bottom:0}
.chalk{font-family:var(--font-chalk);font-size:22px;line-height:1.25}
.dim{color:var(--chalk-dim)}
.small{font-size:14.5px}

/* Vreni */
.vreni-row{display:flex;gap:14px;align-items:flex-start}
.vreni{flex:0 0 auto;width:84px;height:84px}
.vreni.sm{width:60px;height:60px}
.bubble{flex:1;min-width:0}
.bubble .tr{display:block;font-family:var(--font-body);font-size:14.5px;color:var(--chalk-dim)}

/* learning path */
.path{display:flex;flex-direction:column;gap:12px}
.stage{background:rgba(0,0,0,.2);border:1.5px solid var(--felt-line);border-radius:10px;padding:14px}
.stage.locked{opacity:.55}
.stage-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage-num{font-family:var(--font-display);font-size:20px;color:var(--gold)}
.stage h3{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;letter-spacing:.3px}
.stage .state{margin-left:auto;font-size:14px;color:var(--chalk-dim)}
.stage p{margin:4px 0 10px;font-size:15.5px;color:var(--chalk-dim)}
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson-btn{display:flex;align-items:center;gap:10px;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:8px;padding:10px 12px;font-weight:700}
.lesson-btn .lvl{font-weight:400;font-size:13.5px;color:#5c574c;margin-left:auto;white-space:nowrap}
.lesson-btn .tick{width:22px;height:22px;border-radius:50%;border:2px solid #b9b2a0;flex:0 0 auto;display:grid;place-items:center;font-size:13px}
.lesson-btn.done .tick{background:var(--felt);border-color:var(--felt);color:#fff}
.lesson-btn.next{box-shadow:0 0 0 3px var(--gold)}
.lesson-btn:disabled{cursor:not-allowed;background:#cfcabb}
.later{font-size:15px;color:var(--chalk-dim);border-top:1px dashed var(--felt-line);padding-top:12px}
.later b{color:var(--chalk);font-weight:700}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:10px}
.lesson-top .t{font-size:14.5px;color:var(--chalk-dim);margin-right:auto}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--chalk-dim)}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.no{background:var(--bad);border-color:var(--bad)}
.dot.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.prompt{font-family:var(--font-display);font-size:25px;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:.3px}
.table{background:var(--felt);border:2px solid var(--felt-line);border-radius:14px;padding:16px 12px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:inset 0 0 40px rgba(0,0,0,.25)}
.row-label{font-size:13.5px;text-transform:uppercase;letter-spacing:1.2px;color:#cfe3d5;align-self:flex-start}
.cards{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.cardbox{display:flex;flex-direction:column;align-items:center;gap:3px}
.card{width:74px;padding:0;border:0;background:none;border-radius:8px;display:block;transition:transform .12s;position:relative}
.card.tm::before{content:"T";position:absolute;top:-7px;right:-7px;z-index:1;width:21px;height:21px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:700;line-height:18px;text-align:center;border:1.5px solid var(--paper)}
.opt .oi svg{width:22px;height:22px;vertical-align:-5px;margin-right:6px}
.seats{display:block;width:100%;max-width:300px;height:auto}
.rtable{position:relative;padding:10px 12px}
.rmsg{padding:10px 12px}.rmsg .vreni-row{gap:10px;align-items:center}.rmsg .vreni{width:46px;height:46px}.rmsg p{margin:0}.rmsg p+p{margin-top:4px}
.rhand{padding:10px 8px}
.rtable .trumpchip{position:absolute;left:10px;top:10px;flex-direction:column;align-items:flex-start;gap:0;border-radius:10px;padding:4px 10px 5px;font-size:14px}
.rtable .trumpchip i{display:flex;align-items:center;gap:5px;font-style:normal}
.rt{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,54px);justify-items:center;width:100%;max-width:400px}
.rs{display:flex;flex-direction:column;align-items:center;gap:2px}
.rs2{grid-column:2;grid-row:1/3}.rs3{grid-column:1;grid-row:2/4}.rs1{grid-column:3;grid-row:2/4}.rs0{grid-column:2;grid-row:3/5}
.rs .card{width:52px}
.rs.won .card svg{box-shadow:0 0 0 4px var(--good),0 2px 5px rgba(0,0,0,.4)}
.rn{font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:#cfe3d5;display:flex;align-items:center;gap:4px;height:17px;white-space:nowrap}
.rn .tag{font-size:10.5px;letter-spacing:0;text-transform:none;line-height:14px}
.rn .tag.win{background:var(--good)}
.hsum{display:grid;grid-template-columns:auto auto 1fr;gap:2px 12px;font-variant-numeric:tabular-nums}
.hsum span{display:flex;align-items:center;gap:6px}.hsum svg{width:17px;height:17px}
.hsum b{text-align:right}
.ghostcard{aspect-ratio:2/3;border:1.5px dashed var(--felt-line);border-radius:8px}
.rscore{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--font-chalk);font-size:20px;line-height:1.1;background:var(--slate);border:4px solid var(--slate-edge);border-radius:6px;padding:5px 10px}
.rscore b{color:var(--gold);font-size:24px}
.rscore .side{display:flex;align-items:center;gap:7px}
.rscore .side.r{text-align:right}
.rscore i{display:block;font-style:normal;font-family:var(--font-body);font-size:11px;letter-spacing:.4px;color:var(--chalk-dim)}
.badge{width:24px;height:24px;flex:0 0 auto}
.tag.win{background:var(--good)}
.tag.rule{background:#d9d4c6}
.wt{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;font-variant-numeric:tabular-nums}
.wt div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #3a4145;padding:2px 0}
.trumpchip em{font-style:normal;font-size:12.5px;opacity:.8;margin-left:2px}
.lines{align-self:stretch;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:16.5px}
.lines li{background:rgba(0,0,0,.22);border-radius:8px;padding:7px 10px}
.kind .tag{margin-right:3px}
.levels{display:flex;flex-direction:column;gap:5px;font-size:15px}
.levels div{display:flex;gap:8px;align-items:baseline;opacity:.55}
.levels div.on{opacity:1}
.levels .tag{flex:0 0 58px;text-align:center}
.cards.gone{gap:6px;align-self:flex-start;justify-content:flex-start}
.cards.gone .card{width:46px;opacity:.5}
.table .none{margin:0;align-self:flex-start}
.info{align-self:stretch;margin:0;background:rgba(0,0,0,.22);border-radius:8px;padding:7px 10px;font-size:15px}
.rn .badge{width:13px;height:13px}
.dedication{margin:-4px 0 2px;color:var(--gold);font-size:26px;line-height:1.1}
.places{display:flex;flex-direction:column;gap:14px}
.place{display:flex;gap:12px;align-items:flex-start}
.place .badge{width:46px;height:46px;margin-top:2px}
.place b{font-family:var(--font-display);font-weight:400;font-size:19px;letter-spacing:.3px}
.place p{margin:2px 0 4px}.place a{color:var(--gold);font-size:14.5px}
.trumpchip{align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:var(--gold);color:var(--ink);border-radius:999px;padding:4px 12px 4px 10px;font-size:14.5px}
.trumpchip span{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700}
.trumpchip svg{width:22px;height:22px}
.card svg{display:block;width:100%;height:auto;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,.4)}
.hand .card{width:60px}
button.card:hover:not(:disabled){transform:translateY(-4px)}
.card.sel svg{box-shadow:0 0 0 4px var(--gold),0 2px 5px rgba(0,0,0,.4)}
.card.right svg{box-shadow:0 0 0 4px var(--good),0 2px 5px rgba(0,0,0,.4)}
.card.wrong svg{box-shadow:0 0 0 4px var(--bad),0 2px 5px rgba(0,0,0,.4)}
.card.offsuit{opacity:.5}
.card.same svg{box-shadow:0 6px 0 var(--gold),0 2px 5px rgba(0,0,0,.4)}
.card.same{margin-bottom:5px}
.card.same.sel svg{box-shadow:0 0 0 4px var(--gold),0 2px 5px rgba(0,0,0,.4)}
.card.same.right svg{box-shadow:0 0 0 4px var(--good),0 2px 5px rgba(0,0,0,.4)}
.card.same.wrong svg{box-shadow:0 0 0 4px var(--bad),0 2px 5px rgba(0,0,0,.4)}
.card.big{width:104px}
.cap{font-size:13px;color:#e6f0e9;text-align:center;min-height:17px}
.tag{font-size:12px;background:var(--gold);color:var(--ink);border-radius:4px;padding:0 6px;font-weight:700}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opt{background:var(--paper);color:var(--ink);border:0;border-radius:8px;padding:11px 10px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.opt small{display:block;font-weight:400;font-size:13px;color:#5c574c}
.opt.right{background:var(--good)}
.opt.wrong{background:var(--bad)}
.opt:disabled{cursor:default}
.primary{background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 22px;font-weight:700;font-size:17px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:none;border:1.5px solid var(--chalk-dim);border-radius:8px;padding:10px 16px}

.breaks{display:flex;flex-direction:column;gap:10px}
.break{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.break h3{font-family:var(--font-display);font-weight:400;font-size:19px;margin:6px 0 0;letter-spacing:.3px}
.break a:not(.link),.breaks p a{color:var(--gold)}
.player{width:100%;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
a.link{display:inline-block;color:var(--gold);border-color:var(--gold);text-decoration:none;font-weight:700;margin-right:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* aids */
.aid{border:1.5px dashed var(--chalk-dim);border-radius:8px;padding:10px 12px;font-size:15.5px;display:flex;flex-direction:column;gap:6px}
.aid .chalk{font-size:19px}
.ladder{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font-weight:700}
.ladder span.sep{color:var(--chalk-dim);font-weight:400}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:4px 12px;font-variant-numeric:tabular-nums}
.vals div{display:flex;justify-content:space-between;border-bottom:1px solid #3a4145;padding:2px 0}
.help{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px;color:var(--chalk-dim);margin:0}
.seg{display:inline-flex;border:1.5px solid var(--felt-line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 12px;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);font-weight:700}

/* feedback */
.fb{border-left:6px solid var(--good)}
.fb.no{border-left-color:var(--bad)}
.fb .verdict{font-weight:700;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:var(--good)}
.fb.no .verdict{color:var(--bad)}

/* deck sheet */
.suits{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.suit{background:rgba(255,255,255,.06);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center}
.suit svg{width:38px;height:38px;flex:0 0 auto;background:var(--paper);border-radius:6px;padding:4px}
.suit b{display:block;font-size:17px}
.suit span{display:block;font-size:13.5px;color:var(--chalk-dim)}
.say{font-style:italic}
.deckrow{display:flex;flex-wrap:wrap;gap:6px}
.deckrow .cardbox .card{width:54px}
.sheet-table{width:100%;border-collapse:collapse;font-size:15.5px;font-variant-numeric:tabular-nums}
.sheet-table th,.sheet-table td{text-align:left;padding:5px 6px;border-bottom:1px solid #3a4145}
.sheet-table th{font-weight:700;color:var(--chalk-dim);font-size:13.5px;text-transform:uppercase;letter-spacing:.8px}
.sheet-table td.n{text-align:right}
.sheet-table td.say,.sheet-table td:first-child{white-space:nowrap}
.scroll{overflow-x:auto}
.spk{background:none;border:1.5px solid var(--gold);color:var(--gold);border-radius:999px;width:28px;height:28px;padding:0;font-size:13px;line-height:1}
details summary{cursor:pointer;color:var(--chalk-dim);font-size:15px}
.clips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.clips .chip{font-size:13.5px;padding:4px 10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--chalk);padding:10px 16px;border-radius:8px;font-size:15px;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.score{font-family:var(--font-display);font-size:54px;line-height:1;color:var(--gold)}
@media (max-width:400px){
  .card{width:66px}.hand .card{width:54px}.cards.hand{gap:6px}.prompt{font-size:22px}
  .vreni{width:66px;height:66px}
  .brand{font-size:22px}.chip{padding:5px 10px;font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <button class="brand" id="home-btn" type="button">Jass <b>with</b> Vreni</button>
    <button class="chip" id="deck-btn" type="button">The cards</button>
    <button class="chip" id="sound-btn" type="button" aria-pressed="true">Sound on</button>
  </header>
  <main id="app"></main>
</div>
<script>
/*LOGIC-START*/
const SUITS=[
  {id:'eichle',name:'Eichle',en:'acorns',say:'EYE-khleh'},
  {id:'rose',name:'Rose',en:'roses',say:'ROH-zeh'},
  {id:'schelle',name:'Schelle',en:'bells',say:'SHELL-eh'},
  {id:'schilte',name:'Schilte',en:'shields',say:'SHILL-teh'}
];
// Strongest first. This is the order of a plain suit (no Trumpf).
const RANKS=[
  {id:'A',name:'Ass',en:'ace',say:'ahss',pts:11},
  {id:'K',name:'König',en:'king',say:'KUH-nig',pts:4},
  {id:'O',name:'Ober',en:'the queen\u2019s stand-in',say:'OH-ber',pts:3},
  {id:'U',name:'Under',en:'like a jack',say:'OON-der',pts:2},
  {id:'B',name:'Banner',en:'the ten',say:'BAHN-ner',pts:10},
  {id:'9',name:'9',en:'nine',say:'',ch:'Nüüni',chSay:'NEW-nee',pts:0},
  {id:'8',name:'8',en:'eight',say:'',ch:'Achti',chSay:'AHKH-tee',pts:0},
  {id:'7',name:'7',en:'seven',say:'',ch:'Sibni',chSay:'SEEB-nee',pts:0},
  {id:'6',name:'6',en:'six',say:'',ch:'Sächsi',chSay:'SAKH-see',pts:0}
];
const suitOf=id=>SUITS.find(s=>s.id===id);
const rankOf=id=>RANKS.find(r=>r.id===id);
const rankIdx=id=>RANKS.findIndex(r=>r.id===id);
const points=c=>rankOf(c.r).pts;
const cardName=c=>rankOf(c.r).name+' of '+suitOf(c.s).name;
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function deck(){const d=[];for(const s of SUITS)for(const r of RANKS)d.push({s:s.id,r:r.id});return d}

// Index of the card that wins a trick without Trumpf: highest card of the suit led.
function trickWinner(cards){
  let w=0;
  for(let i=1;i<cards.length;i++){
    if(cards[i].s===cards[0].s&&rankIdx(cards[i].r)<rankIdx(cards[w].r))w=i;
  }
  return w;
}
// Indices of the cards you may play without Trumpf: follow suit if you can.
function legalCards(hand,led){
  const same=hand.map((c,i)=>c.s===led.s?i:-1).filter(i=>i>=0);
  return same.length?same:hand.map((_,i)=>i);
}
const trickPoints=cards=>cards.reduce((n,c)=>n+points(c),0);

const LADDER=RANKS.map(r=>r.name);
const PICK_HINT={
  A:'The Ass has no name and no number. Just two big suit signs.',
  K:'Read the corner: KÖNIG. He is also the one wearing the crown.',
  O:'Read the corner: OBER. He holds his suit sign up high, next to his head.',
  U:'Read the corner: UNDER. He holds his suit sign down low, near the middle of the card.',
  B:'The Banner is the flag with a 10 in the corners.'
};
const COUSIN={U:'Jack',O:'Queen',K:'King',B:'Ten'};

function qSuit(){
  const s=pick(SUITS),r=pick(['6','7','8','9','A']);
  return {type:'suit',prompt:'Which suit is this?',cards:[{s:s.id,r}],
    options:SUITS.map(x=>({id:x.id,label:x.name,sub:x.en})),answer:s.id,
    explain:'That is '+s.name+', the '+s.en+'.'};
}
function qPick(){
  const s=pick(SUITS).id,target=pick(['K','O','U','B','A']);
  const others=shuffle(['K','O','U','B','A'].filter(r=>r!==target)).slice(0,3);
  const cards=shuffle(others.concat(target)).map(r=>({s,r}));
  return {type:'pick',prompt:'Tap the '+rankOf(target).name+'.',cards,
    answer:cards.findIndex(c=>c.r===target),explain:PICK_HINT[target],target};
}
function qBridge(){
  const s=pick(SUITS).id,target=pick(['U','O','K','B']);
  let explain='The '+rankOf(target).name+' is your '+COUSIN[target]+'.';

const TRUMP_ORDER=['U','9','A','K','O','B','8','7','6'];
const TRUMP_NAME={U:'Puur','9':'Nell'};
const isTrump=(c,t)=>!!t&&c.s===t;
// How strong a card is inside one trick: Trumpf beats the suit led, the suit led beats the rest.
function power(c,t,led){
  if(isTrump(c,t))return 200-TRUMP_ORDER.indexOf(c.r);
  if(c.s===led)return 100-rankIdx(c.r);
  return 0;
}
function trickWinnerT(cards,t){
  const led=cards[0].s;let w=0;
  for(let i=1;i<cards.length;i++)if(power(cards[i],t,led)>power(cards[w],t,led))w=i;
  return w;
}
function pointsT(c,t){
  if(isTrump(c,t)&&c.r==='U')return 20;
  if(isTrump(c,t)&&c.r==='9')return 14;
  return rankOf(c.r).pts;
}
// Indices of the hand cards that may be played on the trick so far.
function legalT(hand,trick,t){
  const all=hand.map((_,i)=>i),led=trick[0].s;
  const trumps=all.filter(i=>isTrump(hand[i],t));
  if(led===t){
    if(!trumps.length)return all;
    if(trumps.length===1&&hand[trumps[0]].r==='U')return all;      // a lonely Puur cannot be forced out
    return trumps;
  }
  const plain=all.filter(i=>!isTrump(hand[i],t));
  if(!plain.length)return all;                                      // nothing but Trumpf in hand
  const top=Math.max(0,...trick.filter(c=>isTrump(c,t)).map(c=>power(c,t,led)));
  const over=trumps.filter(i=>power(hand[i],t,led)>top);            // no undertrumping
  const follow=all.filter(i=>hand[i].s===led);
  return (follow.length?follow:plain).concat(over).sort((a,b)=>a-b);

const tShort=(c,t)=>isTrump(c,t)&&TRUMP_NAME[c.r]?TRUMP_NAME[c.r]:rankOf(c.r).name;
const tName=(c,t)=>isTrump(c,t)?(TRUMP_NAME[c.r]||rankOf(c.r).name+' of Trumpf'):cardName(c);

function explainTLegal(hand,trick,t){
  const led=trick[0].s,isT=c=>c.s===t,ln=suitOf(led).name;
  const trumps=hand.filter(isT),plain=hand.filter(c=>!isT(c)),follow=plain.filter(c=>c.s===led);
  if(led===t){
    if(!trumps.length)return 'Trumpf was led, but you hold none. So you may play any card.';
    if(trumps.length===1&&trumps[0].r==='U')return 'Trumpf was led, but your only Trumpf is the Puur. Nobody can force him out, so every card is allowed. The Puur too, if you like.';
    return 'Trumpf was led and you hold Trumpf. So you must play Trumpf'+(trumps.length>1?', whichever you like.':'.');
  }
  const inTrick=trick.filter(isT);
  if(!inTrick.length){
    if(follow.length&&trumps.length)return 'You may follow '+ln+', or you may play a Trumpf instead. Your other cards have to wait.';
    if(follow.length)return 'You hold '+ln+' and no Trumpf, so you must follow suit.';
    return 'You hold no '+ln+', so any card is allowed, Trumpf or not.';
  }
  if(!plain.length)return 'You hold nothing but Trumpf. Then, and only then, a lower Trumpf is allowed.';
  const top=inTrick.reduce((a,c)=>power(c,t,led)>power(a,t,led)?c:a);
  const low=trumps.filter(c=>power(c,t,led)<power(top,t,led)),high=trumps.filter(c=>power(c,t,led)>power(top,t,led));
  let out='The trick was trumped with the '+tShort(top,t)+'. ';
  if(low.length)out+='Your '+low.map(c=>tShort(c,t)).join(' and your ')+(low.length>1?' are lower, so they stay':' is lower, so it stays')+' in your hand. ';

  if(high.length)ways.push('overtrump with the '+high.map(c=>tShort(c,t)).join(' or the '));

// scn: 'free' (plain suit led, nobody has trumped), 'trumpled' (Trumpf led), 'under' (the trick is already trumped)
function qTLegal(scn,size){

/* ---------- Chapter 2, part 2: Ansagen, Schieben and a whole round ---------- */
const cnt=(hand,s)=>hand.filter(c=>c.s===s).length;
const holds=(hand,s,r)=>hand.some(c=>c.s===s&&c.r===r);
// Vreni's rule of thumb for Vorhand. Which pattern does this suit fulfil? 0 means none.
function announcePattern(hand,s){
  const n=cnt(hand,s),U=holds(hand,s,'U'),N=holds(hand,s,'9'),A=holds(hand,s,'A');
  if(U&&N&&A)return 3;
  if(U&&n>=4)return 1;
  if(N&&A&&n>=5)return 2;
  if(U&&N&&n>=3&&hand.filter(c=>c.s!==s&&c.r==='A').length>=2)return 4;
  return 0;
}
const PATTERN_TEXT={1:'the Puur with three more cards',2:'Nell and Ass with three more cards',3:'Puur, Nell and Ass',4:'Puur and Nell with a third card, plus two Asses in other suits'};
// {suit, pattern} if Vorhand should name Trumpf herself, null if she should push.
function announceAdvice(hand){
  let best=null;
  for(const s of SUITS){const pt=announcePattern(hand,s.id);if(pt&&(!best||cnt(hand,s.id)>cnt(hand,best.suit)))best={suit:s.id,pattern:pt}}
  return best;
}
// When you must name Trumpf after a push: length first, then Puur, Nell and Ass.
const suitScore=(hand,s)=>cnt(hand,s)*12+(holds(hand,s,'U')?18:0)+(holds(hand,s,'9')?10:0)+(holds(hand,s,'A')?6:0);
const bestSuit=hand=>SUITS.map(s=>s.id).reduce((a,b)=>suitScore(hand,b)>suitScore(hand,a)?b:a);
const keyCards=(hand,s)=>['U','9','A'].filter(r=>holds(hand,s,r)).map(r=>({U:'Under','9':'9',A:'Ass'})[r]);
const SUIT_OPTS=()=>SUITS.map(x=>({id:x.id,label:x.name,sub:x.en,icon:x.id}));

// want: 1 to 4 for a hand that fulfils that pattern, 'push' for a hand that fulfils none
function qAnnounce(want){
  let hand,adv;
  for(let tries=0;tries<400;tries++){
    const p=shuffle(deck());
    if(want==='push'){
      hand=p.slice(0,9);adv=announceAdvice(hand);
      const clear=SUITS.every(s=>cnt(hand,s.id)<=4&&!(holds(hand,s.id,'U')&&holds(hand,s.id,'9')))&&hand.filter(c=>c.r==='A').length<=2;
      if(!adv&&clear)break;
    }else{
      const t=pick(SUITS).id,isT=c=>c.s===t;
      const need={1:['U'],2:['9','A'],3:['U','9','A'],4:['U','9']}[want],size={1:4,2:5,3:3,4:3}[want];
      hand=takeFrom(p,c=>isT(c)&&need.includes(c.r),need.length);
      hand=hand.concat(takeFrom(p,c=>isT(c)&&!'U9A'.includes(c.r),size-hand.length));
      if(want===4)hand=hand.concat(takeFrom(p,c=>!isT(c)&&c.r==='A',2));
      hand=hand.concat(takeFrom(p,c=>!isT(c)&&!'AU9'.includes(c.r),9-hand.length));
      adv=announceAdvice(hand);
      if(hand.length===9&&adv&&adv.suit===t&&adv.pattern===want&&SUITS.filter(s=>announcePattern(hand,s.id)).length===1&&SUITS.every(s=>s.id===t||cnt(hand,s.id)<=4))break;
    }
  }
  sortHand(hand);
  let explain;
  if(adv)explain='You hold '+PATTERN_TEXT[adv.pattern]+' in '+suitOf(adv.suit).name+'. That is strong enough to name Trumpf yourself.';

function dealRound(n){            // n: rounds the learner has finished. The first two deals are prepared.

  if(n===0)mine=[['schelle','U'],['schelle','K'],['schelle','8'],['schelle','6'],['rose','A'],['rose','7'],['eichle','K'],['eichle','9'],['schilte','8']];

  }

  const h0=fix(mine),h2=fix(partner),rest=shuffle(deck()).filter(c=>!taken.has(c.s+c.r));

// The other three play plainly and honestly: take the trick as cheaply as possible, unless the partner already has it.
function botCard(hand,trick,t,partnerWinning){
  const all=hand.map((_,i)=>i);
  if(!trick.length){
    const tr=all.filter(i=>hand[i].s===t),puur=tr.find(i=>hand[i].r==='U');
    if(puur!==undefined&&tr.length>1)return puur;
    const ace=all.find(i=>hand[i].s!==t&&hand[i].r==='A');
    if(ace!==undefined)return ace;
    const plain=all.filter(i=>hand[i].s!==t);
    if(!plain.length)return tr.sort((a,b)=>TRUMP_ORDER.indexOf(hand[b].r)-TRUMP_ORDER.indexOf(hand[a].r))[0];
    const longest=plain.map(i=>hand[i].s).reduce((a,b)=>cnt(hand,b)>cnt(hand,a)?b:a);
    return plain.filter(i=>hand[i].s===longest).sort((a,b)=>rankIdx(hand[b].r)-rankIdx(hand[a].r))[0];
  }
  const legal=legalT(hand,trick,t),led=trick[0].s,pw=i=>power(hand[i],t,led);
  const top=Math.max(...trick.map(c=>power(c,t,led)));
  const winners=legal.filter(i=>pw(i)>top);
  if(winners.length&&!partnerWinning)return winners.sort((a,b)=>pw(a)-pw(b))[0];
  return legal.slice().sort((a,b)=>pointsT(hand[a],t)-pointsT(hand[b],t)||pw(a)-pw(b))[0];
}
function botMove(st,seat){
  const w=st.trick.length?trickWinnerT(st.trick,st.trump):-1;
  return botCard(st.hands[seat],st.trick,st.trump,w>=0&&(st.leader+w)%4===(seat+2)%4);
}

// ----- Weis: rows of three or more in one suit, and four of a kind
const SEQ_PTS={3:20,4:50,5:100,6:150,7:200,8:250,9:300},FOUR_PTS={U:200,'9':150,A:100,K:100,O:100,B:100};
const SEQ_WORD={3:'three',4:'four',5:'five',6:'six',7:'seven',8:'eight',9:'nine'};
function findWeis(hand){
  const out=[],has=(s,r)=>hand.some(c=>c.s===s&&c.r===r);
  for(const x of SUITS){
    let run=[];
    PLAIN.concat([null]).forEach(r=>{
      if(r&&has(x.id,r)){run.push(r);return}
      if(run.length>=3)out.push({kind:'seq',suit:x.id,top:run[0],len:run.length,pts:SEQ_PTS[run.length],cards:run.map(q=>({s:x.id,r:q}))});
      run=[];
    });
  }
  for(const r of Object.keys(FOUR_PTS))if(SUITS.every(x=>has(x.id,r)))out.push({kind:'four',top:r,len:4,pts:FOUR_PTS[r],cards:SUITS.map(x=>({s:x.id,r}))});
  return out;
}
const weisName=w=>w.kind==='four'?'four '+(w.top==='9'?'nines':w.top==='A'?'Asses':rankOf(w.top).name+(w.top==='K'?'e':'')):SEQ_WORD[w.len]+' in a row';
// 1 if a is the higher Weis, -1 if b is, 0 if only the order of play could decide
function weisCompare(a,b,t){
  if(a.pts!==b.pts)return a.pts>b.pts?1:-1;
  if(a.kind!==b.kind)return a.kind==='seq'?1:-1;
  if(a.top!==b.top)return PLAIN.indexOf(a.top)<PLAIN.indexOf(b.top)?1:-1;
  const at=a.kind==='seq'&&a.suit===t,bt=b.kind==='seq'&&b.suit===t;
  return at===bt?0:at?1:-1;
}
const WEIS_OPTS=()=>[{id:0,label:'No Weis'}].concat([20,50,100,150,200].map(n=>({id:n,label:String(n)})));
function qWeisFind(kind){                  // 'seq3' 'seq4' 'seq5' 'four' 'none' 'three'
  let hand,ws;
  for(let tries=0;tries<600;tries++){
    const p=shuffle(deck());hand=[];
    if(kind.indexOf('seq')===0){const L=+kind.slice(3),x=pick(SUITS).id,a=rnd(10-L),rs=PLAIN.slice(a,a+L);hand=takeFrom(p,c=>c.s===x&&rs.includes(c.r),L)}
    if(kind==='four'){const r=pick(['A','K','O','B','9','U','U','9']);hand=takeFrom(p,c=>c.r===r,4)}
    if(kind==='three'){const r=pick(['A','K','O','U','B','9']);hand=takeFrom(p,c=>c.r===r,3)}
    hand=hand.concat(p.slice(0,9-hand.length));ws=findWeis(hand);
    const long=SUITS.some(x=>cnt(hand,x.id)>=3);
    if(kind==='none'||kind==='three'?ws.length===0&&long:ws.length===1&&ws[0].pts<=200)break;
  }
  sortHand(hand);
  const w=ws[0],mark=w?hand.map((c,i)=>w.cards.some(k=>k.s===c.s&&k.r===c.r)?i:-1).filter(i=>i>=0):[];
  const explain=!w?(kind==='three'?'No Weis. Three of a kind count nothing: it takes all four. And none of your suits has three neighbours in a row.':'No Weis. A row needs three neighbours in one suit, with no gap. Four of a kind needs all four suits.')
    :w.kind==='four'?capFirst(weisName(w))+': '+w.pts+' points.'+(w.top==='U'?' Four Under are the highest four of a kind.':w.top==='9'?' Four nines are worth more than four Asses.':'')
    :w.cards.map(c=>rankOf(c.r).name).join(', ').replace(/, ([^,]*)$/,' and $1')+' of '+suitOf(w.suit).name+': '+SEQ_WORD[w.len]+' in a row, '+w.pts+' points.';
  return {type:'weisfind',cards:hand,mark,options:WEIS_OPTS(),answer:w?w.pts:0,prompt:'How much is the Weis in this hand worth?',explain};
}
function qWeisCmp(v){                      // 'value' 'kind' 'top' 'trump'
  const su=shuffle(SUITS).map(x=>x.id),t=su[0],seq=(x,a,L)=>({kind:'seq',suit:x,top:PLAIN[a],len:L,pts:SEQ_PTS[L],cards:PLAIN.slice(a,a+L).map(r=>({s:x,r}))});
  let a,b;
  if(v==='value'){const L=pick([[4,3],[5,3],[5,4]]);a=seq(su[1],rnd(10-L[0]),L[0]);b=seq(su[2],rnd(10-L[1]),L[1])}
  if(v==='kind'){const r=pick(['A','K','O']);          // a five-card row always contains the Banner, so four Banner cannot sit beside one
   b={kind:'four',top:r,len:4,pts:100,cards:SUITS.map(x=>({s:x.id,r}))};
    let st;do{st=rnd(5)}while(PLAIN.slice(st,st+5).includes(r));a=seq(su[1],st,5)}
  if(v==='top'){const L=3+rnd(2),i=rnd(9-L);a=seq(su[1],i,L);b=seq(su[2],i+1+rnd(9-L-i),L)}
  if(v==='trump'){const L=3+rnd(2),i=rnd(10-L);a=seq(t,i,L);b=seq(su[1],i,L)}
  const mineWins=Math.random()<.5,mine=mineWins?a:b,theirs=mineWins?b:a;
  const why={value:capFirst(weisName(a))+' is worth '+a.pts+', '+weisName(b)+' only '+b.pts+'. The higher value wins.',
    kind:'Both are worth 100. Then a row beats four of a kind.',
    top:'Both rows are worth '+a.pts+'. Then the higher top card decides: the '+rankOf(a.top).name+' stands above the '+rankOf(b.top).name+'.',
    trump:'Same length, same top card. Then the row in the Trumpf suit wins, and Trumpf is '+suitOf(t).name+'.'}[v];
  return {type:'weiscmp',trump:t,cards:[],mine:mine.cards,theirs:theirs.cards,v,options:[{id:'mine',label:'Ours'},{id:'theirs',label:'Theirs'}],answer:mineWins?'mine':'theirs',
    prompt:'Both teams have a Weis. Whose is higher?',explain:why+' Only the team with the higher Weis writes.'};
}
function qWeisWrite(){
  const vals=[20,50,100],word={20:'three in a row',50:'four in a row',100:'five in a row'};
  let a,b,c;do{a=pick(vals);b=pick([0,0,20,50]);c=pick(vals)}while(Math.max(a,b)===c);
  const ours=Math.max(a,b)>c,answer=ours?a+b:0;
  return {type:'weiswrite',cards:[],lines:['<b>You:</b> '+word[a]+' ('+a+')','<b>Your partner:</b> '+(b?word[b]+' ('+b+')':'nothing'),'<b>The other team:</b> '+word[c]+' ('+c+')'],
    a,b,c,answer,options:numOpts(answer,[0,a,a+b,c,a+c,a+b+c,Math.max(a,b)]),prompt:'How much Weis does your team write?',
    explain:ours?'Your team holds the highest single Weis ('+Math.max(a,b)+' against '+c+'). So your team writes everything both of you hold: '+(b?a+' + '+b+' = ':'')+(a+b)+'. The other team writes nothing.'
      :'The other team holds the highest single Weis ('+c+' against '+Math.max(a,b)+'). So only they write. Your team writes nothing'+(a+b>c?', even though your two together would be more.':'.')};
}
function qStoeck(v){                       // 'yes' 'othersuit' 'split' 'oben'
  const p=shuffle(deck()),su=shuffle(SUITS).map(x=>x.id),t=su[0],X=su[1],m=v==='oben'?pick(['oben','unde']):null;
  let hand=v==='yes'?[{s:t,r:'K'},{s:t,r:'O'}]:v==='split'?[{s:t,r:'K'},{s:X,r:'O'}]:[{s:X,r:'K'},{s:X,r:'O'}];
  const taken=c=>hand.some(h=>h.s===c.s&&h.r===c.r);
  hand=hand.concat(p.filter(c=>!taken(c)&&!'KO'.includes(c.r)).slice(0,3));sortHand(hand);
  const yes=v==='yes',tn=suitOf(t).name,Xn=suitOf(X).name;
  return {type:'stoeck',trump:m?undefined:t,mode:m||undefined,cards:hand,v,options:[{id:'yes',label:'Yes',sub:'Stöck, 20 points'},{id:'no',label:'No',sub:'no Stöck'}],answer:yes?'yes':'no',
    prompt:'Do you hold Stöck?',
    explain:yes?'König and Ober of '+tn+', and '+tn+' is Trumpf. That is Stöck: 20 points. You call it when you play the second of the two.'
      :v==='split'?'You hold the König of Trumpf, but your Ober is a '+Xn+'. Stöck needs both, König and Ober, of the Trumpf suit.'
      :v==='oben'?'König and Ober of '+Xn+' sit together in your hand, but in '+MODE_NAME[m]+' there is no Trumpf suit. No Trumpf, no Stöck.'
      :'König and Ober of '+Xn+' sit together in your hand, but Trumpf is '+tn+'. Only König and Ober of the Trumpf suit are Stöck.'};
}

function tone(freq,dur,type,vol,when){
  const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);

  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur);
}
function sfx(kind,delay){
  if(!S.sound)return;

    const a=ac();if(!a)return;if(a.state==='suspended')a.resume();
    if(kind==='slap'){
      const len=Math.floor(a.sampleRate*.08),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
      const src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
      src.buffer=buf;f.type='lowpass';f.frequency.value=1400;g.gain.value=.5;
      src.connect(f);f.connect(g);g.connect(a.destination);src.start();
    }
    if(kind==='good'){tone(660,.12,'sine',.12);tone(880,.18,'sine',.12,.1)}
    if(kind==='bad'){tone(220,.22,'triangle',.12)}
    if(kind==='bell'){const d=delay||0;for(let k=0;k<3;k++){tone(540,.35,'square',.07,d+k*.28);tone(800,.35,'square',.07,d+k*.28)}}

const WORDS4=[['obenabe','Obenabe','OH-beh-NAH-beh','top-down: no Trumpf, the Ass is highest'],['undenufe','Undenufe','OON-deh-NOO-feh','bottom-up: no Trumpf, the 6 is highest'],['wys','Weis','veess · say «Wys»','bonus points for rows and fours in the cards you are dealt'],['stoeck','Stöck','shtuck','König and Ober of Trumpf in one hand: 20 points']];
const WORDS=[['jass','Jass','yahss','the game, and what you do: jassen'],['schieber','Schieber','SHEE-ber','the kind of Jass you are learning'],['stich','Stich','shtikh','a trick: four cards, one from each player'],['farb-aagaeh','Farb aagäh','farb AH-gah','to follow suit']];
function ladderHTML(){return '<div class="ladder">'+LADDER.map(n=>'<span>'+n+'</span>').join('<span class="sep">beats</span>')+'</div>'}
function valuesHTML(){return '<div class="vals">'+RANKS.slice(0,5).map(r=>'<div><span>'+r.name+'</span><b>'+r.pts+'</b></div>').join('')+'<div><span>9, 8, 7, 6</span><b>0</b></div></div>'}
function trumpLadderHTML(){return '<div class="ladder">'+['Puur','Nell','Ass','König','Ober','Banner','8','7','6'].map(n=>'<span>'+n+'</span>').join('<span class="sep">beats</span>')+'</div>'}
function modeLadderHTML(m){return '<div class="ladder">'+orderM(m).map(r=>'<span>'+rankOf(r).name+'</span>').join('<span class="sep">beats</span>')+'</div>'}
function modeValuesHTML(m){return '<div class="vals">'+orderM(m).filter(r=>pointsM({r},m)).map(r=>'<div><span>'+rankOf(r).name+'</span><b>'+pointsM({r},m)+'</b></div>').join('')+'<div><span>'+orderM(m).filter(r=>!pointsM({r},m)).map(r=>rankOf(r).name).join(', ')+'</span><b>0</b></div></div>'}
function weisTableHTML(){return '<div class="wt">'+[['3 in a row',20],['4 of a kind',100],['4 in a row',50],['4 nines',150],['5 in a row',100],['4 Under',200]].map(x=>'<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><span class="small dim">Four of a kind: Asses, Könige, Ober or Banner. Four 8, 7 or 6 count nothing.</span>'}
const modeChip=m=>'<div class="trumpchip"><span>No Trumpf</span><b>'+MODE_NAME[m]+'</b><em>'+(m==='unde'?'6 is highest':'Ass is highest')+'</em></div>';
function trumpValuesHTML(){return '<div class="vals">'+[['Puur',20],['Nell',14],['Ass',11],['Banner',10],['König',4],['Ober',3],['8, 7, 6',0]].map(x=>'<div><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><span class="small dim">In the other suits: Under 2, and the 9 nothing.</span>'}
function trumpCardsHTML(suit){
  return '<div class="deckrow">'+TRUMP_ORDER.map(r=>'<div class="cardbox"><span class="card">'+cardSVG({s:suit,r})+'</span><span class="cap">'+tShort({s:suit,r},suit)+'</span></div>').join('')+'</div>';
}
// The table from above: you at the bottom, play runs counter-clockwise.
function seatsSVG(d){
  const pos=[[110,134,'You'],[188,80,'Right'],[110,26,'Partner'],[32,80,'Left']];
  let g='<rect x="60" y="46" width="100" height="68" rx="14" fill="#2f7350" stroke="#0e2c1d" stroke-width="3"/>'
    +'<path d="M128 96A22 19 0 1 0 92 96" fill="none" stroke="#f4efe2" stroke-width="2.6" stroke-linecap="round"/><path d="M92 99l-9 -8l11 -3z" fill="#f4efe2"/>';
  pos.forEach((q,i)=>{
    g+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="19" fill="'+(i===0?'#d1341f':'#24292c')+'" stroke="'+(d&&d.dealer===i?'#e6b43c':'#f4efe2')+'" stroke-width="'+(d&&d.dealer===i?4:1.5)+'"/>'
      +'<text x="'+q[0]+'" y="'+(q[1]+3.5)+'" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff" font-family="Atkinson Hyperlegible,system-ui,sans-serif">'+q[2]+'</text>';
    if(d&&d.dealer===i)g+='<text x="'+q[0]+'" y="'+(q[1]+(i===2?-24:31))+'" text-anchor="middle" font-size="9" font-weight="700" fill="#e6b43c" font-family="Atkinson Hyperlegible,system-ui,sans-serif">deals</text>';
  });
  return '<svg class="seats" viewBox="0 0 220 160" role="img" aria-label="Four players at a table. You sit at the bottom, your partner across from you. Play runs counter-clockwise.">'+g+'</svg>';
}
function handSummaryHTML(hand){
  return '<div class="hsum">'+SUITS.map(x=>{const k=keyCards(hand,x.id),n=cnt(hand,x.id);return '<span>'+symSVG(x.id)+x.name+'</span><b>'+n+'</b><span>'+(n===1?'card':'cards')+(k.length?', with '+k.join(' and '):'')+'</span>'}).join('')+'</div>';
}
const RULE_OF_THUMB='<span class="small">Name Trumpf with: Puur and three more · Nell, Ass and three more · Puur, Nell and Ass · Puur, Nell and one more, plus two Asses elsewhere. The Puur is the Under of the suit, the Nell its 9.</span>';
function suitsHTML(){return '<div class="suits">'+SUITS.map(s=>'<div class="suit">'+symSVG(s.id)+'<div><b>'+s.name+spk(s.id)+'</b><span>'+s.en+'</span><span class="say">say: '+s.say+'</span></div></div>').join('')+'</div>'}
function facesHTML(suit){
  return '<div class="deckrow">'+RANKS.map(r=>'<div class="cardbox"><span class="card">'+cardSVG({s:suit,r:r.id})+'</span><span class="cap">'+r.name+'</span></div>').join('')+'</div>';
}
function introVisual(kind){
  if(kind==='suits')return suitsHTML();
  if(kind==='faces')return facesHTML('rose');
  if(kind==='ladder')return ladderHTML();
  if(kind==='sixnine')return '<div class="deckrow">'+['6','9'].map(r=>'<div class="cardbox"><span class="card" style="width:84px">'+cardSVG({s:'schelle',r})+'</span><span class="cap">'+r+'</span></div>').join('')+'</div>';
  if(kind==='values')return valuesHTML();
  if(kind==='trumpcards')return '<p class="small dim">With Schilte as Trumpf, from strongest to weakest:</p>'+trumpCardsHTML('schilte');
  if(kind==='trumpvalues')return trumpValuesHTML();
  if(kind==='oben'||kind==='unde')return modeChip(kind)+'<p class="small dim" style="margin:8px 0 4px">From strongest to weakest:</p>'+modeLadderHTML(kind)+'<p class="small dim" style="margin:8px 0 4px">The points:</p>'+modeValuesHTML(kind);
  if(kind==='weis')return weisTableHTML()+'<p class="small dim" style="margin-top:8px">The order for rows: Ass, König, Ober, Under, Banner, 9, 8, 7, 6.</p>';
  if(kind==='bock')return '<div class="deckrow">'+[['A','played'],['K','<span class="tag win">Bock</span>'],['O',''],['U','']].map(x=>'<div class="cardbox"><span class="card" style="width:64px'+(x[0]==='A'?';opacity:.4':'')+'">'+cardSVG({s:'rose',r:x[0]})+'</span><span class="cap">'+x[1]+'</span></div>').join('')+'</div><p class="small dim">The Ass of Rose has been played. Now the König is the highest Rose left.</p>';
  if(kind.indexOf('levels-')===0){
    const k=kind.slice(7),on=x=>k===x||k==='both'?' class="on"':'';
    return '<div class="levels"><div><span class="tag rule">Rule</span><span>what you must do: follow suit, no undertrumping</span></div>'
      +'<div'+on('tactic')+'><span class="tag">Tactic</span><span>what often pays off</span></div>'
      +'<div'+on('signal')+'><span class="tag win">Signal</span><span>what your card tells your partner</span></div></div>'
      +'<p class="small dim" style="margin-top:8px">This lesson is about '+(k==='both'?'a tactic that is also a signal':k==='signal'?'a signal':'a tactic')+'. Nobody can force you to play this way.</p>';
  }
  if(kind==='seats')return '<div style="max-width:260px">'+seatsSVG({dealer:3})+'</div><p class="small dim">Here the player on your left has dealt. So you are Vorhand.</p>';
  return '';
}

/* ---------- lesson ---------- */
function startLesson(si,li){
  const ls=STAGES[si].lessons[li];
  if(ls.round){startRound(si,li);return}
  R=null;
  const queue=[];for(let i=0;i<ls.n;i++){const q=ls.gen(i);q.first=true;queue.push(q)}
  L={si,li,ls,queue,idx:0,marks:[],right:0,help:ls.help,phase:'intro',hinted:false,sel:[],chosen:null,ok:null};
  renderLesson();
}
function renderLesson(){
  const st=STAGES[L.si];
  if(L.phase==='intro'){
    app.innerHTML='<div class="slate"><div class="vreni-row">'+vreni('happy')+'<div class="bubble">'
      +'<h2>'+L.ls.title+'</h2><p>'+L.ls.text.replace(/\{([a-z-]+)\}/g,(m,k)=>spk(k))+'</p></div></div>'
      +(L.ls.intro?'<div style="margin-top:14px">'+introVisual(L.ls.intro)+'</div>':'')
      +'<div class="actions" style="margin-top:16px"><button class="primary" type="button" data-act="begin">Start</button>'
      +'<button class="ghost" type="button" data-go="home">Not now</button></div></div>';
    return;
  }
  const q=L.queue[L.idx],answered=L.phase==='feedback';
  const showAid=L.help===0||(L.help===1&&L.hinted);
  const labels=showAid&&['stronger','winner','legal','count','tstronger','twinner','tlegal','tcount','bock','mybock','best','mstronger','mwinner','mcount'].includes(q.type);
  const dots=L.queue.slice(0,L.ls.n).map((_,i)=>'<span class="dot'+(L.marks[i]===true?' ok':L.marks[i]===false?' no':'')+(i===Math.min(L.idx,L.ls.n-1)&&L.idx<L.ls.n?' now':'')+'"></span>').join('');
  const cardBtn=(c,i,group)=>{
    const tappable=(group==='table'&&['pick','stronger','winner','tpick','tstronger','twinner','bock','mstronger','mwinner'].includes(q.type))||(group==='hand');
    let cls='card';
    if(group==='table'&&q.cards.length===1&&q.options)cls+=' big';
    if(group==='hand'&&L.sel.includes(i))cls+=' sel';
    if(showAid&&(q.type==='winner'||q.type==='twinner'||q.type==='mwinner')&&c.s!==q.led&&c.s!==q.trump&&!answered)cls+=' offsuit';
    if(answered&&q.mark&&group==='table'&&q.mark.includes(i))cls+=' right';
    if(showAid&&q.hand&&group==='hand'&&c.s===q.led&&c.s!==q.trump)cls+=' same';
    if(showAid&&q.trump&&c.s===q.trump)cls+=' tm';
    if(answered){
      if(group==='hand'){if(q.answer.includes(i))cls+=' right';else if(q.single?i===L.chosen:L.sel.includes(i))cls+=' wrong'}
      else if(tappable){if(i===q.answer)cls+=' right';else if(i===L.chosen)cls+=' wrong'}
    }
    const tag=group==='table'&&i===0&&q.led!==undefined?'<span class="tag">led</span>':'';
    const seat=q.seats&&group==='table'?q.seats[i]:'';
    const wtag=showAid&&seat&&i===q.winning?' <span class="tag win">winning</span>':'';
    const cap=seat||(labels?(q.trump?tShort(c,q.trump):rankOf(c.r).name):'');
    const inner=tappable
      ?'<button type="button" class="'+cls+'" data-card="'+i+'" data-group="'+group+'"'+(answered?' disabled':'')+' aria-pressed="'+(group==='hand'&&L.sel.includes(i))+'">'+cardSVG(c)+'</button>'
      :'<span class="'+cls+'">'+cardSVG(c)+'</span>';
    return '<div class="cardbox">'+inner+'<span class="cap">'+cap+' '+tag+wtag+'</span></div>';
  };
  const shown=(c,dim)=>'<div class="cardbox"><span class="card'+(showAid&&q.trump&&c.s===q.trump?' tm':'')+'">'+cardSVG(c)+'</span><span class="cap">'+(showAid?tShort(c,q.trump):'')+'</span></div>';
  const row=(cards,cls)=>cards.length?'<div class="cards '+cls+'">'+cards.map(shown).join('')+'</div>':'<p class="small dim none">None.</p>';
  const handRow=()=>'<span class="row-label">Your hand</span><div class="cards hand">'+q.hand.map((c,i)=>cardBtn(c,i,'hand')).join('')+'</div>';
  let table='<div class="cards">'+q.cards.map((c,i)=>cardBtn(c,i,'table')).join('')+'</div>';
  if(q.last)table='<span class="row-label">Last trick of the round</span>'+table;

function aidHTML(q){
  if(q.type==='suit')return suitsHTML();
  if(q.type==='pick')return '<span class="chalk">'+PICK_HINT[q.target]+'</span>';
  if(q.type==='bridge')return '<span>Under = Jack. Ober = Queen’s seat. König = King. Banner = Ten.</span>';
  if(q.type==='number')return '<span>'+(q.covered?'The number down there is upside down. Turn it in your head: what looks like a 9 is a 6, and the other way round.':'Read the top corners. The number at the bottom is upside down.')+'</span>';
  if(q.type==='stronger')return ladderHTML();
  if(q.type==='winner')return '<span><b>'+suitOf(q.led).name+'</b> was led. Only '+suitOf(q.led).name+' can win.</span>'+ladderHTML();
  if(q.type==='legal')return '<span><b>'+suitOf(q.led).name+'</b> was led. Hold that suit? Then play it. Hold none? Then anything goes.</span>'+(q.has?'<span class="small dim">The gold bar marks your '+suitOf(q.led).name+' cards.</span>':'');
  if(q.type==='mc'||q.type==='read')return '<span>'+q.hint+'</span>';
  if(q.type==='mwinner')return '<span>No Trumpf, so nobody can trump. Only <b>'+suitOf(q.led).name+'</b> can win, and '+(q.mode==='unde'?'the lowest':'the highest')+' one does.</span>'+modeLadderHTML(q.mode);
  if(q.type==='mstronger')return modeLadderHTML(q.mode);
  if(q.type==='mvalue'||q.type==='mcount')return modeValuesHTML(q.mode);
  if(q.type==='weisfind')return '<span>Go through your hand suit by suit and look for neighbours: Ass, König, Ober, Under, Banner, 9, 8, 7, 6. Then look for the same card in all four suits.</span>'+weisTableHTML();
  if(q.type==='weiscmp')return '<span>1. The higher value wins. 2. Same value: a row beats four of a kind. 3. Then the higher top card. 4. Then the Trumpf suit.</span>'+weisTableHTML();
  if(q.type==='weiswrite')return '<span>Find the single highest Weis at the table. Only that team writes, and it writes everything both partners hold.</span>';
  if(q.type==='stoeck')return '<span>Stöck are the König and the Ober of the Trumpf suit, both in your hand. Look at the gold tag first: which suit is Trumpf, if any?</span>';
  if(q.type==='bock')return '<span>Cross out what has been played. The first card left in the order is '+(q.trump?'the highest Trumpf':'Bock')+'.</span>'+(q.trump?trumpLadderHTML():ladderHTML());
  if(q.type==='mybock')return '<span>Check your cards one by one: is a higher card of the same suit still out? If not, your card is Bock.</span>'+ladderHTML();
  if(q.type==='trumpcount')return '<span>Every suit has nine cards. Nine, minus the Trumpf that have been played, minus the Trumpf in your hand.</span>';
  if(q.type==='best')return '<span>'+q.hint+'</span>'+(q.cards.length?'<span class="small dim">The green tag shows who would take the trick right now.</span>':'');
  if(q.type==='announce')return '<span>Count each suit, and look for Under, 9 and Ass:</span>'+handSummaryHTML(q.cards)+RULE_OF_THUMB;
  if(q.type==='pushed')return '<span>Which suit is longest? And where are the Under and the 9?</span>'+handSummaryHTML(q.cards);
  if(q.type==='tpick')return '<span>The Puur is the Under of the Trumpf suit. The Nell is its 9. The red T marks every Trumpf card.</span>';
  if(q.type==='tstronger')return trumpLadderHTML();
  if(q.type==='twinner')return '<span>Is there a Trumpf in the trick? Look for the red T. Then the highest Trumpf wins. If not, the highest <b>'+suitOf(q.led).name+'</b> wins.</span>'+trumpLadderHTML();
  if(q.type==='tvalue'||q.type==='tcount')return trumpValuesHTML()+(q.last?'<span><b>Last trick:</b> add 5.</span>':'');
  if(q.type==='tlegal'){
    const ln=suitOf(q.led).name,inTrick=q.cards.filter(c=>c.s===q.trump);
    if(q.led===q.trump)return '<span>Trumpf was led. Do you hold a Trumpf (red T)? Then you must play one. Only a lonely Puur may stay home.</span>';
    if(!inTrick.length)return '<span><b>'+ln+'</b> was led. You may follow suit (gold bar) or play a Trumpf (red T). Hold no '+ln+'? Then anything goes.</span>';
    const top=inTrick.reduce((a,c)=>power(c,q.trump,q.led)>power(a,q.trump,q.led)?c:a);
    return '<span>The trick was trumped with the <b>'+tShort(top,q.trump)+'</b>. A lower Trumpf is not allowed, unless you hold nothing but Trumpf.</span>'+trumpLadderHTML();
  }
  return valuesHTML();
}
function answer(ok){
  const q=L.queue[L.idx];L.ok=ok;L.phase='feedback';
  if(q.first){L.marks[L.idx]=ok;if(ok)L.right++;else{const again=L.ls.gen(L.idx);again.first=false;L.queue.push(again)}}
  L.line=ok&&(q.type==='winner'||q.type==='twinner')&&Math.random()<.4?TRICK_LINE:pick(ok?GOOD:BAD);
  L.verdict=null;L.pre='';
  if(q.type==='best'){
    if(ok&&q.line)L.line=q.line;
    if(!ok){
      const legal=q.legal.includes(L.chosen);
      L.verdict=legal?'Allowed, but there is a better card':'Not allowed';
      if(!legal)L.pre='That card is against the rules here. '+explainTLegal(q.hand,q.cards,q.trump)+' ';
    }
  }
  if(ok&&q.type==='stoeck'&&q.answer==='yes')L.line=['Stöck!','König and Ober of Trumpf.','stoeck-ruf'];
  if(ok&&q.type==='mwinner'&&Math.random()<.35)L.line=[MODE_NAME[q.mode]+'!',q.mode==='unde'?'Bottom-up.':'Top-down.',q.mode==='unde'?'undenufe':'obenabe'];
  if(ok&&q.type==='weisfind'&&q.answer&&Math.random()<.5)L.line=['En Wys!','A Weis!','wys'];
  if(ok&&(q.type==='mybock'||(q.type==='bock'&&!q.trump))&&Math.random()<.5)L.line=['Bock!','Nobody can beat it.','bock'];
  if(ok&&q.type==='tpick')L.line=[TRUMP_NAME[q.target]+'!',q.target==='U'?'The boss.':'Second in command.',q.target==='U'?'puur':'nell'];
  if(ok&&q.type==='announce'&&q.answer==='push')L.line=['Gschobe!','Pushed. Your partner has to choose.','gschobe'];
  if(!ok&&q.type==='tlegal'&&q.under.some(i=>L.sel.includes(i)))L.line=['Untertrumpfe? Nid a mim Tisch!','Undertrumping? Not at my table!','nid-a-mim-tisch'];
  if(ok&&q.type==='number'){const r=rankOf(q.answer);L.line=[r.ch+'!',r.en.charAt(0).toUpperCase()+r.en.slice(1)+'.',AUDIO_KEY[r.id]]}
  if(!voice(L.line[2]))sfx(ok?'good':'bad');
  renderLesson();
}
function finishLesson(){
  const score=L.right/L.ls.n,k=lkey(L.si,L.li),prev=S.best[k]||0;
  const wasPassed=stagePassed(L.si);
  S.best[k]=Math.max(prev,score);save();
  const passed=!L.ls.check||score>=PASS;
  if(L.ls.check&&passed){const spoke=voice('jetzt-chasch-es');if(!wasPassed)sfx('bell',spoke?1.5:0)}
  else if(!L.ls.check&&score>=PASS)voice('suuber');
  const pct=Math.round(score*100);
  let msg;
  if(L.ls.check)msg=passed
    ?'<p class="chalk">Jetzt chasch es!<span class="tr">Now you’ve got it!</span></p><p>Stage '+(L.si+1)+' is done.'+(!STAGES[L.si+1]?' That is everything so far. More is on the way.':STAGES[L.si+1].ch!==STAGES[L.si].ch?' Chapter '+STAGES[L.si].ch+' is done. Stage '+(L.si+2)+' opens Chapter '+STAGES[L.si+1].ch+'.':' Stage '+(L.si+2)+' is open.')+'</p>'
     +'<p class="small">'+songLink('Celebrate with a song')+' <span class="dim">When Vreni wins, she puts this on.</span></p>'
    :'<p class="chalk">Fast.<span class="tr">Almost.</span></p><p>You need 80% to open the next stage. Go back a lesson, or try the check again. No one is counting but me.</p>'
     +'<p class="small">'+extLink(SKETCH_URL,'Take a break with Emil')+' <span class="dim">«Der Jasser», a Swiss comedy classic from 1974.</span></p>';
  else msg='<p class="chalk">'+(score>=PASS?'Suuber!':'Guet.')+'<span class="tr">'+(score>=PASS?'Clean!':'Good.')+'</span></p><p>'+(score>=PASS?'Ready for the next lesson, with a little less help.':'Do it once more if you like. Repeating is how Jass gets into your hands.')+'</p>';
  const si=L.si,li=L.li;
  app.innerHTML='<div class="slate"><div class="vreni-row">'+vreni(passed?'happy':'oops')+'<div class="bubble"><div class="score">'+pct+'%</div>'
    +'<p class="dim small">'+L.right+' of '+L.ls.n+' right on the first try</p>'+msg+'</div></div>'
    +'<div class="actions" style="margin-top:16px"><button class="primary" type="button" data-go="home">Back to the path</button>'
    +'<button class="ghost" type="button" data-stage="'+si+'" data-lesson="'+li+'">Again</button></div></div>';
  L=null;
}

const WHO=['You win','The player on your right wins','Your partner wins','The player on your left wins'];
function startRound(si,li){
  L=null;
  R={si,li,st:newRound(dealRound(S.rounds||0),0),phase:'intro',help:0,hinted:false,msg:'',bad:null,mistakes:0,mood:'happy',shown:null,token:Math.random()};
  renderRound();
}
function roundBots(){
  const st=R.st,tok=R.token;
  if(R.phase!=='play')return;
  if(st.trick.length===4){roundEndTrick();return}
  if(st.turn===0){R.msg=st.trick.length?'Your turn.':'Your lead. Any card is allowed.';renderRound();return}
  R.msg='The others are playing.';renderRound();
  setTimeout(()=>{
    if(!R||R.token!==tok||R.phase!=='play')return;
    const seat=st.turn;roundPlay(st,seat,botMove(st,seat));sfx('slap');roundBots();
  },BOT_DELAY);
}
function roundEndTrick(){
  const st=R.st,cards=st.trick.slice(),leader=st.leader,t=roundCloseTrick(st);
  const card=cards[(t.winner-leader+4)%4],last=st.done.length===9;
  R.shown={cards,leader,winner:t.winner};R.phase='trickdone';R.mood='happy';
  R.msg='<b>'+WHO[t.winner]+'</b> with the '+tName(card,st.trump)+'. '+t.points+(t.points===1?' point':' points')+' for '+TEAMS[t.winner%2].name+'.'+(last?' That includes 5 for the last trick.':'');
  if(t.winner===0&&!R.called){R.called=true;voice('das-isch-en-stich')}
  renderRound();
}
function roundName(choice){
  const st=R.st,adv=announceAdvice(st.hands[0]);let note;
  if(choice==='push'){
    st.trump=bestSuit(st.hands[2]);voice('gschobe');
    note=(adv?'You could have named '+suitOf(adv.suit).name+' yourself: '+PATTERN_TEXT[adv.pattern]+'. But pushing is always allowed. ':'Gschobe! Good. These cards are made for pushing. ')
      +'Your partner names <b>'+suitOf(st.trump).name+'</b>.';
  }else{
    st.trump=choice;voice('trumpf');
    note=adv&&adv.suit===choice?'Good call. You hold '+PATTERN_TEXT[adv.pattern]+'.'
      :adv?'Allowed. Vreni would have named '+suitOf(adv.suit).name+', where you hold '+PATTERN_TEXT[adv.pattern]+'. But it is your call.'
      :'Brave. Vreni would have pushed with these cards. But it is your call.';
    note+=' <b>'+suitOf(choice).name+'</b> is Trumpf.';
  }
  R.pushed=choice==='push';R.phase='play';R.hinted=false;
  R.msg=note+(R.pushed?' You are still Vorhand, so you play the first card. Any card is allowed.':' You are Vorhand, so you play the first card. Any card is allowed.');
  renderRound();
  const top=document.querySelector('.lesson-top');if(top&&top.scrollIntoView)top.scrollIntoView({block:'start'});
}
function roundTap(i){
  const st=R.st;if(R.phase!=='play'||st.turn!==0||st.trick.length===4)return;
  const legal=st.trick.length?legalT(st.hands[0],st.trick,st.trump):st.hands[0].map((_,k)=>k);
  if(!legal.includes(i)){
    const c=st.hands[0][i],under=c.s===st.trump&&st.trick[0].s!==st.trump&&st.trick.some(x=>x.s===st.trump);
    R.mistakes++;R.bad=i;R.mood='oops';
    R.msg='<b>Not allowed.</b> '+explainTLegal(st.hands[0],st.trick,st.trump);
    if(!voice(under?'nid-a-mim-tisch':'nei-nei-nei'))sfx('bad');
    renderRound();return;
  }
  R.bad=null;R.mood='happy';R.hinted=false;sfx('slap');
  roundPlay(st,0,i);roundBots();

function roundFinish(){
  const st=R.st,match=st.won[0]===9?0:st.won[1]===9?1:-1;
  if(match>=0)st.score[match]+=100;
  R.phase='done';R.match=match;
  S.best[lkey(R.si,R.li)]=1;S.rounds=(S.rounds||0)+1;save();
  if(match===0){voice('heitere-fahne');sfx('bell',2.6)}else voice('merci');
  renderRound();
}
function renderRound(){
  const st=R.st;
  if(R.phase==='intro'){
    app.innerHTML='<div class="slate"><div class="vreni-row">'+vreni('happy')+'<div class="bubble"><h2>Your first round</h2><p>'+STAGES[R.si].lessons[R.li].text+'</p></div></div>'
      +'<div style="max-width:260px;margin-top:12px">'+seatsSVG({dealer:3})+'</div>'
      +'<div class="actions" style="margin-top:16px"><button class="primary" type="button" data-ract="deal">Deal the cards</button><button class="ghost" type="button" data-go="home">Not now</button></div></div>';
    return;
  }
  if(R.phase==='done'){
    const m=R.match,sum=st.score[0]+st.score[1];
    const verdict=m===0?'Nine tricks for Idaho. The lions of Winterthur have gone very quiet.'
      :m===1?'Nine tricks for Winterthur. The lions are purring. They will stop when you have read Chapter 3.'
      :st.score[0]>st.score[1]?'Idaho wins the round. The lions of Winterthur want a rematch.'
      :'Winterthur wins this one. Home advantage, says Vreni. The potatoes want a rematch.';
    app.innerHTML='<div class="slate">'+scoreHTML(st.score)+'<div class="vreni-row" style="margin-top:12px">'+vreni(m===1?'oops':'happy')+'<div class="bubble"><h2>The round is over</h2>'
      +'<p><b>'+verdict+'</b></p>'
      +'<p>Your team took '+st.won[0]+' of the nine tricks, the others took '+st.won[1]+'.</p>'
      +(m===0?'<p class="chalk">Heitere Fahne, en Match!<span class="tr">Good heavens, a Match!</span></p><p>You took all nine tricks. That is called a Match and brings 100 points on top: 257.</p>'
        :m===1?'<p>They took all nine tricks. That is called a Match and brings them 100 points on top: 257. It happens to the best of us.</p>'
        :'<p>Add the two numbers: '+st.score[0]+' + '+st.score[1]+' = '+sum+'. It is 157 in every round, the 5 for the last trick included.</p>')
      +(R.mistakes?'<p class="small dim">'+R.mistakes+(R.mistakes===1?' card was':' cards were')+' not allowed along the way. That is what a first round is for.</p>':'<p class="small dim">And not one card against the rules. Suuber.</p>')
      +'<p class="chalk">Merci fürs Jasse. Bis zum nächschte Mal!<span class="tr">Thanks for playing. See you next time!</span></p></div></div>'
      +'<div class="actions" style="margin-top:16px"><button class="primary" type="button" data-ract="again">Play another round</button><button class="ghost" type="button" data-go="home">Back to the path</button></div></div>';
    return;
  }
  const showAid=R.help===0||(R.help===1&&R.hinted);
  const mine=st.hands[0],myTurn=R.phase==='play'&&st.turn===0&&st.trick.length<4;
  const legal=myTurn?(st.trick.length?legalT(mine,st.trick,st.trump):mine.map((_,i)=>i)):[];
  const tm=c=>showAid&&st.trump&&c.s===st.trump?' tm':'';
  const hand='<div class="cards hand">'+mine.map((c,i)=>'<div class="cardbox"><button type="button" class="card'+tm(c)+(myTurn&&showAid&&!legal.includes(i)?' offsuit':'')+(R.bad===i?' wrong':'')+'" data-rcard="'+i+'"'+(myTurn?'':' disabled')+'>'+cardSVG(c)+'</button></div>').join('')+'</div>';
  const trickNo=Math.min(st.done.length+(R.phase==='trickdone'?0:1),9);
  const top='<div class="lesson-top"><span class="t">'+(R.phase==='announce'?'Stage '+(R.si+1)+' · Your first round':'Your first round · Trick '+trickNo+' of 9')+'</span><button class="ghost" type="button" data-go="home" aria-label="Leave the round">Leave</button></div>';
  const helpSeg='<div class="help"><span>Help:</span><div class="seg" role="group" aria-label="Help level">'+HELP.map((h,i)=>'<button type="button" data-help="'+i+'" aria-pressed="'+(R.help===i)+'">'+h+'</button>').join('')+'</div></div>';
  if(R.phase==='announce'){
    const opts=SUIT_OPTS().concat([{id:'push',label:'Gschobe',sub:'push to my partner'}]);
    app.innerHTML=top+'<h2 class="prompt">You are Vorhand. Name Trumpf, or push?</h2>'
      +'<div class="table"><span class="row-label">Your hand</span>'+hand+'</div>'
      +'<div class="options">'+opts.map(o=>'<button type="button" class="opt" data-rsuit="'+o.id+'">'+(o.icon?'<span class="oi">'+symSVG(o.icon)+'</span>':'')+o.label+'<small>'+o.sub+'</small></button>').join('')+'</div>'
      +(showAid?'<div class="aid"><span>Count each suit, and look for Under, 9 and Ass:</span>'+handSummaryHTML(mine)+RULE_OF_THUMB+'</div>'
        :R.help===1?'<div class="actions"><button class="ghost" type="button" data-ract="hint">Ask Vreni for a hint</button></div>':'')
      +helpSeg;
    return;
  }
  const shown=R.phase==='trickdone'?R.shown:{cards:st.trick,leader:st.leader,winner:-1};
  const slot=seat=>{
    const k=(seat-shown.leader+4)%4,c=shown.cards[k];
    return '<div class="rs rs'+seat+(shown.winner===seat?' won':'')+'"><span class="rn">'+badgeSVG(seat%2)+SEATS[seat]+(shown.winner===seat?' <span class="tag win">wins</span>':c&&k===0?' <span class="tag">led</span>':'')+'</span>'
      +(c?'<span class="card'+tm(c)+'">'+cardSVG(c)+'</span>':'<span class="card ghostcard"></span>')+'</div>';
  };
  app.innerHTML=top
    +scoreHTML(st.score)
    +'<div class="table rtable"><div class="trumpchip"><span>Trumpf</span><i>'+symSVG(st.trump)+'<b>'+suitOf(st.trump).name+'</b></i></div><div class="rt">'+[2,3,1,0].map(slot).join('')+'</div></div>'
    +'<div class="slate fb rmsg'+(R.mood==='oops'?' no':'')+'" id="round-msg" aria-live="polite"><div class="vreni-row">'+vreni(R.mood,'sm')+'<div class="bubble"><p>'+R.msg+'</p>'
    +(R.phase==='trickdone'?'<div class="actions" style="margin-top:8px"><button class="primary" type="button" data-ract="next" id="next-btn">'+(st.done.length===9?'Count the points':'Next trick')+'</button></div>':'')
    +(myTurn&&R.help===1&&!R.hinted?'<div class="actions" style="margin-top:8px"><button class="ghost" type="button" data-ract="hint">Ask Vreni for a hint</button></div>':'')
    +(myTurn&&showAid&&st.trick.length?'<p class="small dim">The faded cards are not allowed right now.</p>':'')
    +'</div></div></div>'
    +(mine.length?'<div class="table rhand" role="group" aria-label="Your hand">'+hand+'</div>':'')+helpSeg;
}
function roundClick(t){
  if(t.dataset.help!==undefined){R.help=+t.dataset.help;R.hinted=false;renderRound();return}
  if(t.dataset.ract==='deal'){R.phase='announce';renderRound();window.scrollTo(0,0);return}
  if(t.dataset.ract==='hint'){R.hinted=true;if(!R.hintSaid){R.hintSaid=true;voice('zerscht-daenke')}renderRound();return}
  if(t.dataset.ract==='again'){startRound(R.si,R.li);R.phase='announce';renderRound();window.scrollTo(0,0);return}
  if(t.dataset.rsuit!==undefined&&R.phase==='announce'){roundName(t.dataset.rsuit);return}
  if(t.dataset.rcard!==undefined){roundTap(+t.dataset.rcard);return}
  if(t.dataset.ract==='next'&&R.phase==='trickdone'){
    if(R.st.done.length===9){roundFinish();window.scrollTo(0,0);return}
    R.phase='play';R.shown=null;roundBots();
  }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='home-btn'||t.dataset.go==='home'){renderHome();window.scrollTo(0,0);return}
  if(t.id==='deck-btn'){renderDeck();window.scrollTo(0,0);return}
  if(t.id==='sound-btn'){S.sound=!S.sound;save();syncSound();if(S.sound)sfx('good');return}
  if(t.dataset.say){say(t.dataset.say);return}
  if(t.dataset.stage!==undefined&&t.dataset.lesson!==undefined){startLesson(+t.dataset.stage,+t.dataset.lesson);window.scrollTo(0,0);return}
  if(R){roundClick(t);return}
  if(!L)return;
  const q=L.queue[L.idx];
  if(t.dataset.help!==undefined){if(!L.ls.check){L.help=+t.dataset.help;L.hinted=false;renderLesson()}return}
  if(t.dataset.act==='begin'){L.phase='ask';renderLesson();return}
  if(t.dataset.act==='hint'){L.hinted=true;if(!L.hintSaid){L.hintSaid=true;voice('zerscht-daenke')}renderLesson();return}
  if(t.dataset.act==='next'){
    L.idx++;L.sel=[];L.chosen=null;L.hinted=false;L.ok=null;
    if(L.idx>=L.queue.length){finishLesson()}else{L.phase='ask';renderLesson()}
    window.scrollTo(0,0);return;
  }
  if(L.phase!=='ask')return;
  if(t.dataset.opt!==undefined){
    const v=typeof q.answer==='number'?+t.dataset.opt:t.dataset.opt;
    L.chosen=v;answer(v===q.answer);return;
  }
  if(t.dataset.card!==undefined){
    const i=+t.dataset.card;sfx('slap');
    if(t.dataset.group==='hand'){
      if(q.single){L.chosen=i;answer(q.answer.includes(i));return}
      L.sel=L.sel.includes(i)?L.sel.filter(x=>x!==i):L.sel.concat(i);renderLesson();return;
    }
    L.chosen=i;answer(i===q.answer);return;
  }
  if(t.dataset.act==='all'){L.sel=L.sel.length===q.hand.length?[]:q.hand.map((_,i)=>i);renderLesson();return}
  if(t.dataset.act==='check'){
    const a=q.answer.slice().sort((x,y)=>x-y),s=L.sel.slice().sort((x,y)=>x-y);
    answer(a.length===s.length&&a.every((x,i)=>x===s[i]));return;
  }
});
function syncSound(){const b=document.getElementById('sound-btn');b.setAttribute('aria-pressed',String(S.sound));b.textContent=S.sound?'Sound on':'Sound off'}
syncSound();renderHome();
</script>
